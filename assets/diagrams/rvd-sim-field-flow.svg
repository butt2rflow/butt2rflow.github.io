<svg width="100%" viewBox="0 0 360 168" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">현장 흐름 — 시뮬은 출발점이다</title>
<desc id="de">시뮬레이션에서 대량 학습한 뒤 실제 소량으로 미세조정·검증하고, 남는 간극을 보정으로 메워 배포하는 순서.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:9.5px;fill:var(--mut)}
.num{font-size:11px;font-weight:700}
.box{fill:var(--bg);stroke:var(--bd);stroke-width:1.3}
.ar{stroke:var(--blue);stroke-width:1.8;fill:none;marker-end:url(#ah)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="168" rx="12"/>
<text class="t" x="18" y="24">시뮬 대량 학습 → 실물 검증 → 보정 → 배포</text>
<rect class="box" x="14" y="42" width="98" height="72" rx="10"/>
<text class="num" x="26" y="62" style="fill:var(--teal)">① 시뮬 학습</text>
<text class="st" x="26" y="82">대량으로 넓게</text>
<text class="st" x="26" y="96">(도메인 랜덤화)</text>
<line class="ar" x1="114" y1="78" x2="128" y2="78"/>
<rect class="box" x="131" y="42" width="98" height="72" rx="10"/>
<text class="num" x="143" y="62" style="fill:var(--amber)">② 실물 검증</text>
<text class="st" x="143" y="82">소량 미세조정</text>
<text class="st" x="143" y="96">또는 최소 검증</text>
<line class="ar" x1="231" y1="78" x2="245" y2="78"/>
<rect class="box" x="248" y="42" width="98" height="72" rx="10"/>
<text class="num" x="260" y="62" style="fill:var(--blue)">③ 보정</text>
<text class="st" x="260" y="82">카메라 캘리브·</text>
<text class="st" x="260" y="96">좌표계 정합</text>
<text class="st" x="180" y="140" text-anchor="middle" style="fill:var(--mut)">시뮬은 출발점이지 종착점이 아니다 — 간극은 겪으며 메운다</text>
</svg>
