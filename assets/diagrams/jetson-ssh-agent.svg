<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SSH로 에이전트형 AI를 보드에 들여보내기</title>
<desc>데스크톱의 에이전트형 AI(2세대·Claude)가 SSH로 Jetson 엣지 보드에 직접 접속해, 명령을 실행하고 출력·로그를 읽고 막히면 스스로 고친다. 2세대 에이전트형 AI가 SSH로 들어가 3세대 피지컬 AI가 설 자리를 세우는 셈이다.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.h{font-size:15px;font-weight:700;}
.t{font-size:13.5px;font-weight:700;}
.s{font-size:11px;fill:#73726c;}
.lbl{font-size:11px;font-weight:700;}
</style>
<rect x="0" y="0" width="680" height="300" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="40" style="fill:#3d3d3a">SSH로 AI를 보드에 들여보내기</text>

<!-- desktop -->
<rect x="40" y="82" width="250" height="128" rx="10" fill="#eef1f6" stroke="#5b6b86" stroke-width="1.3"/>
<text class="t" x="165" y="110" text-anchor="middle" style="fill:#3f4d66">데스크톱 / 노트북</text>
<rect x="72" y="128" width="186" height="58" rx="9" fill="#fdf1dc" stroke="#c9a24a" stroke-width="1.3"/>
<text class="t" x="165" y="154" text-anchor="middle" style="fill:#a9791f">에이전트형 AI · Claude</text>
<text class="s" x="165" y="172" text-anchor="middle">2세대 (스스로 도구를 씀)</text>

<!-- SSH channel -->
<text class="lbl" x="340" y="104" text-anchor="middle" style="fill:#16a34a">SSH</text>
<line x1="292" y1="122" x2="386" y2="122" stroke="#16a34a" stroke-width="2.4"/>
<path d="M378,117 L386,122 L378,127" fill="none" stroke="#16a34a" stroke-width="2.4"/>
<text class="s" x="340" y="138" text-anchor="middle" style="fill:#16a34a">명령 실행 →</text>
<line x1="386" y1="164" x2="292" y2="164" stroke="#16a34a" stroke-width="2.4"/>
<path d="M300,159 L292,164 L300,169" fill="none" stroke="#16a34a" stroke-width="2.4"/>
<text class="s" x="340" y="180" text-anchor="middle" style="fill:#16a34a">← 출력 · 로그</text>

<!-- jetson -->
<rect x="388" y="82" width="252" height="128" rx="10" fill="#e3f6ea" stroke="#16a34a" stroke-width="1.6"/>
<text class="t" x="514" y="110" text-anchor="middle" style="fill:#15803d">Jetson Orin NX</text>
<text class="s" x="514" y="132" text-anchor="middle">엣지 보드 (헤드리스)</text>
<text class="s" x="514" y="156" text-anchor="middle">AI가 직접 셋업하고</text>
<text class="s" x="514" y="174" text-anchor="middle">막히면 로그 읽고 자동 수정</text>

<text class="t" x="40" y="258" style="fill:#3d3d3a">2세대(에이전트형)가 SSH로 들어가 → 3세대(피지컬 AI)가 설 자리를 세운다.</text>
<text class="s" x="40" y="280" style="fill:#8a6d3b">내 지식·능력 너머의 일도, 옆에 AI를 두면 넘을 수 있었다.</text>
</svg>
