<svg width="100%" viewBox="0 0 360 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">두 가지 라벨 생산 방식 비교</title>
<desc id="de">SAM은 사람이 라벨을 만들고 모델이 초안을 내고 사람이 고치는 선순환으로 실사진 라벨을 불렸고, Stereo·Pose는 사람이 못 찍는 깊이·포즈 라벨이라 정답이 이미 있는 시뮬레이터로 갔다. '사람이 찍을 수 있는 라벨인가'가 둘을 갈랐다.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="250" rx="12"/>
<text class="t" x="18" y="22">라벨은 어디서 오는가</text>
<rect class="bx" x="16" y="34" width="160" height="176" rx="10"/>
<text class="lb" x="96" y="54" text-anchor="middle" style="fill:var(--teal)">SAM · 사람 ↔ 모델 루프</text>
<rect class="bxc" x="30" y="66" width="132" height="30" rx="7"/>
<text class="st" x="96" y="86" text-anchor="middle">사람이 라벨링</text>
<path class="ar" d="M96,96 L96,110"/>
<rect class="bxc" x="30" y="112" width="132" height="30" rx="7"/>
<text class="st" x="96" y="132" text-anchor="middle">모델 학습</text>
<path class="ar" d="M96,142 L96,156"/>
<rect class="bxc" x="30" y="158" width="132" height="30" rx="7"/>
<text class="st" x="96" y="178" text-anchor="middle">모델이 초안 제안</text>
<path class="ln dash" d="M166,173 C182,173 182,81 166,81"/>
<text class="lb" x="96" y="202" text-anchor="middle">사람은 고치기만 → 점점 빨라짐</text>
<rect class="bx" x="184" y="34" width="160" height="176" rx="10"/>
<text class="lb" x="264" y="54" text-anchor="middle" style="fill:var(--blue)">Stereo · Pose · 시뮬레이터</text>
<rect class="bxc" x="198" y="66" width="132" height="30" rx="7"/>
<text class="st" x="264" y="86" text-anchor="middle">장면을 렌더링</text>
<path class="ar" d="M264,96 L264,110"/>
<rect class="bxc" x="198" y="112" width="132" height="76" rx="7"/>
<text class="st" x="264" y="136" text-anchor="middle">정답은 이미 있음</text>
<text class="lb" x="264" y="154" text-anchor="middle">픽셀별 깊이 · 물체 포즈</text>
<text class="lb" x="264" y="172" text-anchor="middle" style="fill:var(--blue)">라벨 비용 = 0</text>
<text class="lb" x="264" y="202" text-anchor="middle">사람 개입 없음 · 무한 생산</text>
<text class="lb" x="180" y="236" text-anchor="middle">사람이 찍을 수 있는 라벨인가? — 이 질문이 갈랐다</text>
</svg>
