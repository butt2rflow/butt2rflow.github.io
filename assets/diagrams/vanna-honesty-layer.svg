<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>정직 레이어 — 어디까지 믿나 (견고 / 휴리스틱 / 과장)</title>
<desc>세 층으로 나눈다. 견고(교과서·피어리뷰): 그릭 정의·세 흐름, 딜러 순 숏 변동성(GPP), 만기 핀닝(NPP), 딜러 감마의 장중 효과(Barbon&amp;Buraschi), 0DTE 약 59%. 프레임워크(휴리스틱): vanna rally, charm의 OPEX 드리프트, GEX 레짐 지도 — 방향 예측은 아님. 과장·회피: 딜러가 시장을 지배한다, OPEX 후 취약 구간, 특정 업체 GEX가 정답, 개별주에 그대로 적용, 월간 OPEX 효과 불변.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.h{font-size:15px;font-weight:700;}
.lb{font-size:13.5px;font-weight:800;}
.s{font-size:11px;fill:#5c5b55;}
</style>
<rect x="0" y="0" width="680" height="300" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="38" style="fill:#3d3d3a">정직 레이어 — 어디까지 믿나</text>

<!-- solid -->
<rect x="40" y="58" width="600" height="66" rx="9" fill="#e3f6ea" stroke="#16a34a" stroke-width="1.2"/>
<rect x="40" y="58" width="7" height="66" rx="3" fill="#16a34a"/>
<text class="lb" x="62" y="82" style="fill:#15803d">견고 — 그대로 믿어도 됨 (교과서·피어리뷰)</text>
<text class="s" x="62" y="103">그릭 정의·세 흐름 / 딜러 순 숏 변동성(GPP) / 만기 핀닝(NPP)</text>
<text class="s" x="62" y="118">/ 딜러 감마의 장중 증폭·억제(Barbon&amp;Buraschi) / 0DTE ~59%</text>

<!-- heuristic -->
<rect x="40" y="132" width="600" height="52" rx="9" fill="#fdf1dc" stroke="#c9a24a" stroke-width="1.2"/>
<rect x="40" y="132" width="7" height="52" rx="3" fill="#e0870b"/>
<text class="lb" x="62" y="156" style="fill:#a9791f">프레임워크 — "흔한 프레임"으로만 (휴리스틱)</text>
<text class="s" x="62" y="176">vanna rally / charm의 OPEX 드리프트 / GEX 레짐 지도 — 방향 예측 아님</text>

<!-- overstated -->
<rect x="40" y="192" width="600" height="66" rx="9" fill="#f7dcd6" stroke="#d84a3a" stroke-width="1.2"/>
<rect x="40" y="192" width="7" height="66" rx="3" fill="#d84a3a"/>
<text class="lb" x="62" y="216" style="fill:#b23a2c">과장 — 피하거나 반박</text>
<text class="s" x="62" y="237">딜러가 시장을 지배 / OPEX 후 '취약 구간' 확실 / 특정 업체 GEX=정답</text>
<text class="s" x="62" y="252">/ 개별주에 그대로 적용 / 월간 OPEX 효과 불변</text>

<text class="s" x="40" y="284" style="fill:#8a6d3b">수학은 견고, 포지셔닝은 추정, 시장 영향 주장은 폭이 넓다.</text>
</svg>
