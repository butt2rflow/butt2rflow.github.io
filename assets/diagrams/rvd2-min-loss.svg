<svg width="100%" viewBox="0 0 360 214" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">최소 손실 학습</title>
<desc id="de">마스크 세 장 중 정답에 가장 가까운 한 장만 손실에 넣는다. 각 출력이 자기 층위에 특화되며 역할 분담이 생긴다.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="214" rx="12"/>
<text class="t" x="18" y="22">셋 중 하나만 채점</text>
<rect class="bx" x="16" y="38" width="100" height="70" rx="8"/>
<text class="lb" x="66" y="60" text-anchor="middle">m₁</text>
<text class="lb" x="66" y="82" text-anchor="middle">오차 0.31</text>
<text class="lb" x="66" y="99" text-anchor="middle">무시</text>
<rect x="130" y="38" width="100" height="70" rx="8" fill="var(--bg)" stroke="var(--teal)" stroke-width="2.2"/>
<text class="lb" x="180" y="60" text-anchor="middle" style="fill:var(--teal)">m₂</text>
<text class="lb" x="180" y="82" text-anchor="middle" style="fill:var(--teal)">오차 0.06</text>
<text class="lb" x="180" y="99" text-anchor="middle" style="fill:var(--teal)">← 이것만 학습</text>
<rect class="bx" x="244" y="38" width="100" height="70" rx="8"/>
<text class="lb" x="294" y="60" text-anchor="middle">m₃</text>
<text class="lb" x="294" y="82" text-anchor="middle">오차 0.58</text>
<text class="lb" x="294" y="99" text-anchor="middle">무시</text>
<text class="st" x="180" y="136" text-anchor="middle">벌을 안 받은 출력은 자기 층위를 지킨다</text>
<rect class="bxc" x="16" y="150" width="328" height="44" rx="8"/>
<text class="lb" x="180" y="170" text-anchor="middle">동시에 IoU 헤드가 "각 장이 얼마나 맞을지"를 예측</text>
<text class="lb" x="180" y="186" text-anchor="middle">→ 실행 시엔 사람 없이도 한 장을 고를 수 있다</text>
</svg>
