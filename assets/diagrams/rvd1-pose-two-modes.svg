<svg width="100%" viewBox="0 0 360 178" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">CAD 기반 모드와 참조 이미지 기반 모드</title>
<desc id="de">FoundationPose는 같은 모델을 두 방식으로 쓴다. CAD가 있으면 도면 파일을 그대로 넣어 정확도가 최고이고, CAD가 없으면 물체를 여러 각도에서 몇 장 찍어 등록해 돌린다. 어느 쪽이든 재학습은 없다.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="178" rx="12"/>
<text class="t" x="18" y="22">같은 모델, 두 가지 사용법</text>
<rect class="bx" x="16" y="34" width="160" height="112" rx="10"/>
<text class="lb" x="96" y="54" text-anchor="middle" style="fill:var(--amber)">CAD가 있다</text>
<text class="st" x="96" y="78" text-anchor="middle">도면 파일을 그대로</text>
<text class="st" x="96" y="96" text-anchor="middle">모델에 넣는다</text>
<text class="lb" x="96" y="120" text-anchor="middle">제조업의 기본 경로</text>
<text class="lb" x="96" y="138" text-anchor="middle" style="fill:var(--teal)">정확도 최고</text>
<rect class="bx" x="184" y="34" width="160" height="112" rx="10"/>
<text class="lb" x="264" y="54" text-anchor="middle" style="fill:var(--blue)">CAD가 없다</text>
<text class="st" x="264" y="78" text-anchor="middle">물체를 여러 각도에서</text>
<text class="st" x="264" y="96" text-anchor="middle">몇 장 찍어 등록</text>
<text class="lb" x="264" y="120" text-anchor="middle">주조품·유기물·커스텀</text>
<text class="lb" x="264" y="138" text-anchor="middle">암묵적 3D 표현을 즉석 생성</text>
<text class="lb" x="180" y="170" text-anchor="middle">어느 쪽이든 '재학습'은 없다</text>
</svg>
