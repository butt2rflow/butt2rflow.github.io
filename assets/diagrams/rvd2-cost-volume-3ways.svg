<svg width="100%" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">코스트 볼륨 구성 세 가지</title>
<desc id="de">좌·우 특징을 대조하는 방법에는 상관·결합·그룹별 상관 세 가지가 있다. FoundationStereo는 결합과 그룹별 상관을 함께 쓰는 하이브리드다.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="300" rx="12"/>
<text class="t" x="18" y="22">같은 4차원, 다른 채우는 법</text>
<rect class="bx" x="16" y="34" width="328" height="76" rx="10"/>
<text class="lb" x="30" y="53" style="fill:var(--blue)">① 상관(correlation) — 내적 한 번</text>
<text class="st" x="30" y="72">두 특징 벡터를 곱해 스칼라 하나로. 채널이 1이라</text>
<text class="st" x="30" y="88">아주 가볍다. 대신 <tspan style="fill:var(--red)">정보가 뭉개진다</tspan>.</text>
<text class="lb" x="30" y="104">[1, D, H, W]</text>
<rect class="bx" x="16" y="118" width="328" height="76" rx="10"/>
<text class="lb" x="30" y="137" style="fill:var(--teal)">② 결합(concat) — 그냥 붙인다</text>
<text class="st" x="30" y="156">좌·우 특징을 채널 방향으로 이어 붙이고 판단은</text>
<text class="st" x="30" y="172">네트워크에 맡긴다. 표현력 최고, <tspan style="fill:var(--red)">메모리 최악</tspan>.</text>
<text class="lb" x="30" y="188">[2C, D, H, W]</text>
<rect class="bx" x="16" y="202" width="328" height="76" rx="10"/>
<text class="lb" x="30" y="221" style="fill:var(--amber)">③ 그룹별 상관 — 절충안</text>
<text class="st" x="30" y="240">채널을 G개 그룹으로 나눠 그룹마다 내적. 상관의</text>
<text class="st" x="30" y="256">가벼움과 결합의 표현력 사이 타협점.</text>
<text class="lb" x="30" y="272">[G, D, H, W]</text>
<text class="lb" x="180" y="294" text-anchor="middle">FoundationStereo는 ②+③ 를 함께 쓰는 하이브리드</text>
</svg>
