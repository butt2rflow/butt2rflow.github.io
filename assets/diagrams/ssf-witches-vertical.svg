<svg width="100%" viewBox="0 0 680 850" xmlns="http://www.w3.org/2000/svg" role="img"><title>네마녀의 날 캐리커처 — 세로형 모바일용</title><desc>밤하늘을 나는 네 마녀 캐리커처. 위쪽 세 마녀는 지수선물, 지수옵션, 개별주식옵션이고 한 마녀는 빗자루에서 미끄러지고 있다. 반짝이 궤적을 끌고 합류하는 앰버색 네 번째 마녀가 6년 만에 복귀한 개별주식선물이다.</desc>
