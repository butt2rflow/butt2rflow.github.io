<svg width="100%" viewBox="0 0 360 222" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">SAM 2의 메모리 기반 추적</title>
<desc id="de">처음 한 프레임에서만 클릭하면, SAM 2는 지금까지 이 물체가 어떻게 생겼고 어디 있었는지를 담은 메모리로 이후 프레임을 스스로 따라간다. 가려졌다 다시 나와도 같은 물체로 이어 붙인다.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="222" rx="12"/>
<text class="t" x="18" y="22">한 번 클릭, 계속 따라간다</text>
<circle class="hi2" cx="52" cy="46" r="4"/>
<text class="lb" x="62" y="50" style="fill:var(--teal)">여기서만 클릭</text>
<g>
<rect class="bx" x="16" y="58" width="72" height="56" rx="8"/>
<text class="st" x="52" y="92" text-anchor="middle">t1</text>
<rect class="bx" x="100" y="58" width="72" height="56" rx="8"/>
<text class="st" x="136" y="92" text-anchor="middle">t2</text>
<rect class="bx" x="184" y="58" width="72" height="56" rx="8"/>
<text class="st" x="220" y="92" text-anchor="middle">t3</text>
<rect class="bx" x="268" y="58" width="72" height="56" rx="8"/>
<text class="st" x="304" y="92" text-anchor="middle">t4</text>
</g>
<path class="arb" d="M88,86 L98,86"/>
<path class="arb" d="M172,86 L182,86"/>
<path class="arb" d="M256,86 L266,86"/>
<path class="ln" d="M52,114 L52,138"/>
<path class="ln" d="M136,114 L136,138"/>
<path class="ln" d="M220,114 L220,138"/>
<rect class="bxc" x="16" y="140" width="324" height="40" rx="9"/>
<text class="st" x="178" y="165" text-anchor="middle">메모리 — 지금까지 이 물체가 어떻게 생겼고 어디 있었나</text>
<path class="arb" d="M304,140 L304,120"/>
<text class="lb" x="180" y="204" text-anchor="middle">가려졌다 다시 나와도 같은 물체로 이어 붙인다</text>
</svg>
