<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">네 가지 연습장 비교</title>
<desc id="de">실물 산업용 로봇, URSim(UR의 가상 컨트롤러), 화낙 가상 로봇(ROBOGUIDE와 화낙 ROS 2 드라이버), SO-101(작은 교육용 실물 팔)을 구하기 쉬움, 안전 부담, 배우는 것, 못 배우는 것으로 비교한다. URSim은 무료이고 산업용 드라이버와 안전 설정을 배울 수 있지만 카메라와 물리가 없다. ROBOGUIDE는 유료다. SO-101은 저렴하고 카메라, 캘리브레이션, 시연 학습을 배울 수 있지만 산업용 컨트롤러 동작과 정밀도는 배울 수 없다.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--green:#15803d;--chip:#f3efe4;--term:#1f2430;--termfg:#d6dbe5;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--green:#4ade80;--chip:#26251e;--term:#0e1016;--termfg:#d6dbe5;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:14px;font-weight:700}
.lb{font-size:12.5px;font-weight:700}
.nd{font-size:11.5px;font-weight:600}
.it{font-size:12px;font-weight:600}
.st{font-size:11px;fill:var(--mut)}
.sm{font-size:10px;fill:var(--mut)}
.code{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px}
.panel{fill:var(--bg);stroke:var(--bd);stroke-width:1}
.bx{fill:var(--card);stroke:var(--blue);stroke-width:1.4}
.bxg{fill:var(--card);stroke:var(--bd);stroke-width:1.2}
.bxa{fill:var(--card);stroke:var(--amber);stroke-width:1.6}
.bxt{fill:var(--card);stroke:var(--teal);stroke-width:1.8}
.bxr{fill:var(--card);stroke:var(--red);stroke-width:1.6}
.bxgr{fill:var(--card);stroke:var(--green);stroke-width:1.8}
.hi{fill:var(--chip);stroke:var(--amber);stroke-width:1.8}
.ctl{fill:var(--bg);stroke:var(--mut);stroke-width:1.3;stroke-dasharray:5 4}
.fam{fill:var(--chip);stroke:none}
.obs{fill:var(--chip);stroke:var(--mut);stroke-width:1.2}
.term{fill:var(--term);stroke:none}
.tc{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px;fill:var(--termfg)}
.tg{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px;fill:#7ee0a0}
.tr{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px;fill:#ff8a8a}
.dim{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px;fill:#8a93a6}
.ar{stroke:var(--blue);stroke-width:1.5;fill:none;marker-end:url(#ah)}
.ara{stroke:var(--amber);stroke-width:1.5;fill:none;marker-end:url(#aa)}
.art{stroke:var(--teal);stroke-width:1.6;fill:none;marker-end:url(#at)}
.arg{stroke:var(--mut);stroke-width:1.4;fill:none;marker-end:url(#ag)}
.arr{stroke:var(--red);stroke-width:1.5;fill:none;marker-end:url(#ar)}
.ln{stroke:var(--mut);stroke-width:1.3;fill:none}
.lnb{stroke:var(--blue);stroke-width:3;fill:none;stroke-linecap:round}
.lna{stroke:var(--amber);stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:6 4}
.dash{stroke-dasharray:4 3}
.jt{fill:var(--card);stroke:var(--blue);stroke-width:1.6}
.dot{fill:var(--blue)}
.dota{fill:var(--amber)}
.dott{fill:var(--teal)}
.dotr{fill:var(--red)}
.sph{fill:none;stroke:var(--teal);stroke-width:1.3}
.mk{fill:var(--blue)}.mka{fill:var(--amber)}.mkt{fill:var(--teal)}.mkg{fill:var(--mut)}.mkr{fill:var(--red)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mka"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkt"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkg"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkr"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="680" height="330" rx="12"/>
<text class="t" x="18" y="26">서로 가르쳐 주는 게 거의 겹치지 않는다</text>
<rect class="bxg" x="140" y="44" width="124" height="34" rx="8"/>
<text class="lb" x="202.0" y="65.0" text-anchor="middle">실물 UR·화낙</text>
<rect class="bx" x="270" y="44" width="124" height="34" rx="8"/>
<text class="lb" x="332.0" y="65.0" text-anchor="middle">URSim</text>
<rect class="bx" x="400" y="44" width="124" height="34" rx="8"/>
<text class="lb" x="462.0" y="65.0" text-anchor="middle">화낙 가상</text>
<rect class="bxa" x="530" y="44" width="124" height="34" rx="8"/>
<text class="lb" x="592.0" y="65.0" text-anchor="middle">SO-101</text>
<text class="it" x="18" y="116">구하기</text>
<rect class="bxg" x="140" y="88" width="124" height="46" rx="6"/>
<text class="sm" x="202" y="116" text-anchor="middle" style="fill:var(--fg)">어렵다</text>
<rect class="bxg" x="270" y="88" width="124" height="46" rx="6"/>
<text class="sm" x="332" y="116" text-anchor="middle" style="fill:var(--fg)">무료</text>
<rect class="bxg" x="400" y="88" width="124" height="46" rx="6"/>
<text class="sm" x="462" y="116" text-anchor="middle" style="fill:var(--fg)">유료 (ROBOGUIDE)</text>
<rect class="bxg" x="530" y="88" width="124" height="46" rx="6"/>
<text class="sm" x="592" y="116" text-anchor="middle" style="fill:var(--fg)">저렴</text>
<text class="it" x="18" y="172">안전 부담</text>
<rect class="bxg" x="140" y="144" width="124" height="46" rx="6"/>
<text class="sm" x="202" y="172" text-anchor="middle" style="fill:var(--fg)">크다</text>
<rect class="bxg" x="270" y="144" width="124" height="46" rx="6"/>
<text class="sm" x="332" y="172" text-anchor="middle" style="fill:var(--fg)">없다</text>
<rect class="bxg" x="400" y="144" width="124" height="46" rx="6"/>
<text class="sm" x="462" y="172" text-anchor="middle" style="fill:var(--fg)">없다</text>
<rect class="bxg" x="530" y="144" width="124" height="46" rx="6"/>
<text class="sm" x="592" y="172" text-anchor="middle" style="fill:var(--fg)">작다</text>
<text class="it" x="18" y="228">배우는 것</text>
<rect class="bxg" x="140" y="200" width="124" height="46" rx="6"/>
<text class="sm" x="202" y="228" text-anchor="middle" style="fill:var(--fg)">전부</text>
<rect class="bxg" x="270" y="200" width="124" height="46" rx="6"/>
<text class="sm" x="332" y="228" text-anchor="middle" style="fill:var(--fg)">UR 드라이버·안전 설정</text>
<rect class="bxg" x="400" y="200" width="124" height="46" rx="6"/>
<text class="sm" x="462" y="228" text-anchor="middle" style="fill:var(--fg)">화낙 드라이버 연결</text>
<rect class="bxg" x="530" y="200" width="124" height="46" rx="6"/>
<text class="sm" x="592" y="228" text-anchor="middle" style="fill:var(--fg)">카메라·물리·시연 학습</text>
<text class="it" x="18" y="284">못 배우는 것</text>
<rect class="bxg" x="140" y="256" width="124" height="46" rx="6"/>
<text class="sm" x="202" y="284" text-anchor="middle" style="fill:var(--fg)">-</text>
<rect class="bxg" x="270" y="256" width="124" height="46" rx="6"/>
<text class="sm" x="332" y="284" text-anchor="middle" style="fill:var(--fg)">카메라·물리·집기</text>
<rect class="bxg" x="400" y="256" width="124" height="46" rx="6"/>
<text class="sm" x="462" y="284" text-anchor="middle" style="fill:var(--fg)">카메라·물리</text>
<rect class="bxg" x="530" y="256" width="124" height="46" rx="6"/>
<text class="sm" x="592" y="284" text-anchor="middle" style="fill:var(--fg)">산업용 컨트롤러·정밀도</text>
<text class="sm" x="18" y="322" style="fill:var(--fg)">두 연습장을 섞으면 서로의 빈칸을 메운다: 산업용 통합은 URSim, 인식과 학습은 SO-101</text>
</svg>
