<svg width="100%" viewBox="0 0 360 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">FoundationStereo 내부 구조</title>
<desc id="de">두 계통을 합친 구조. 좌·우 매칭이 만든 코스트 볼륨과 왼쪽 한 장의 모노 깊이 특징을 같은 점수판 위에서 섞고, 반복 정제로 다듬어 구멍 없는 미터 단위 깊이를 낸다.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="330" rx="12"/>
<text class="t" x="18" y="22">두 계통을 합친다</text>
<rect class="bx" x="16" y="34" width="150" height="46" rx="9"/>
<text class="st" x="91" y="55" text-anchor="middle">좌·우 사진</text>
<text class="lb" x="91" y="71" text-anchor="middle">두 장 매칭</text>
<rect class="bx" x="194" y="34" width="150" height="46" rx="9"/>
<text class="st" x="269" y="55" text-anchor="middle">왼쪽 사진 한 장</text>
<text class="lb" x="269" y="71" text-anchor="middle">단일 이미지 단서</text>
<path class="ar" d="M91,80 L91,104"/>
<path class="ar" d="M269,80 L269,104"/>
<rect class="bxc" x="16" y="106" width="150" height="50" rx="9"/>
<text class="st" x="91" y="128" text-anchor="middle">코스트 볼륨</text>
<text class="lb" x="91" y="144" text-anchor="middle">후보별 점수판</text>
<rect class="bxc" x="194" y="106" width="150" height="50" rx="9"/>
<text class="st" x="269" y="128" text-anchor="middle">모노 깊이 특징</text>
<text class="lb" x="269" y="144" text-anchor="middle">음영·윤곽·원근</text>
<path class="arb" d="M91,156 L91,178 L180,178"/>
<path class="arb" d="M269,156 L269,178 L180,178"/>
<path class="arb" d="M180,178 L180,196"/>
<rect class="bx" x="16" y="198" width="328" height="48" rx="9"/>
<text class="st" x="180" y="220" text-anchor="middle">두 신호를 섞어 점수판을 다시 쓴다</text>
<text class="lb" x="180" y="236" text-anchor="middle">민무늬 구간은 모노 단서가 메운다</text>
<path class="ar" d="M180,246 L180,262"/>
<rect class="bx" x="16" y="264" width="328" height="48" rx="9"/>
<text class="st" x="180" y="286" text-anchor="middle">반복 정제 (같은 블록을 여러 번)</text>
<text class="lb" x="180" y="302" text-anchor="middle">거친 답 → 조금씩 수정 → 서브픽셀 정밀도</text>
<text class="lb" x="180" y="326" text-anchor="middle" style="fill:var(--blue)">결과 : 구멍 없는 미터 단위 깊이</text>
</svg>
