<svg width="100%" viewBox="0 0 360 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">FoundationPose 전체 구조</title>
<desc id="de">CAD 유무에 따라 앞단만 갈라지고, 공통 렌더러 인터페이스 뒤로 가설 생성·정제·순위 결정을 똑같이 쓴다.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="340" rx="12"/>
<text class="t" x="18" y="22">앞단은 둘, 뒷단은 하나</text>
<rect class="bx" x="16" y="34" width="150" height="56" rx="9"/>
<text class="lb" x="91" y="53" text-anchor="middle" style="fill:var(--amber)">CAD 있음</text>
<text class="st" x="91" y="72" text-anchor="middle">메시를 그대로</text>
<text class="lb" x="91" y="86" text-anchor="middle">렌더러에 투입</text>
<rect class="bx" x="194" y="34" width="150" height="56" rx="9"/>
<text class="lb" x="269" y="53" text-anchor="middle" style="fill:var(--blue)">CAD 없음</text>
<text class="st" x="269" y="72" text-anchor="middle">참조 사진 몇 장 →</text>
<text class="lb" x="269" y="86" text-anchor="middle">신경 물체장 학습</text>
<path class="ar" d="M91,90 L91,106 L180,106"/>
<path class="ar" d="M269,90 L269,106 L180,106"/>
<path class="arb" d="M180,106 L180,122"/>
<rect class="bxc" x="16" y="124" width="328" height="42" rx="9"/>
<text class="lb" x="180" y="142" text-anchor="middle">공통 인터페이스 : "임의 자세에서 이 물체를 그려줘"</text>
<text class="lb" x="180" y="158" text-anchor="middle" style="fill:var(--teal)">= 새 시점 렌더링 능력</text>
<path class="arb" d="M180,166 L180,182"/>
<rect class="bx" x="16" y="184" width="328" height="42" rx="9"/>
<text class="lb" x="180" y="203" text-anchor="middle">① 가설 생성 — 자세 후보 수백 개</text>
<text class="lb" x="180" y="219" text-anchor="middle">시점 42 × 면내회전 12 ≈ 500개</text>
<path class="arb" d="M180,226 L180,242"/>
<rect class="bx" x="16" y="244" width="328" height="42" rx="9"/>
<text class="lb" x="180" y="263" text-anchor="middle">② Refiner — 각 가설을 정답 쪽으로 민다</text>
<text class="lb" x="180" y="279" text-anchor="middle">반복 적용</text>
<path class="arb" d="M180,286 L180,302"/>
<rect class="bx" x="16" y="304" width="328" height="34" rx="9"/>
<text class="lb" x="180" y="325" text-anchor="middle">③ 순위 결정 — 후보들을 서로 비교해 하나 선택</text>
</svg>
