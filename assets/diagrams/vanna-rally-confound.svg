<svg width="100%" viewBox="0 0 680 268" xmlns="http://www.w3.org/2000/svg" role="img">
<title>vanna rally인가, 그냥 재레버리징인가</title>
<desc>변동성이 내리면 두 흐름이 동시에 지수를 민다: 딜러의 바나 헷지 되사기와 변동성 타깃 펀드의 기계적 매수. 방향과 타이밍이 겹쳐 어느 쪽이 밀었는지 구분할 수 없고, 자금 규모로는 시스템 펀드가 더 클 수도 있다.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
.h{font-size:15px;font-weight:700;}
.nm{font-size:13.5px;font-weight:700;}
.d{font-size:11.5px;fill:#73726c;}
.note{font-size:12.5px;font-weight:700;}
</style>
<defs>
<marker id="ar1" markerWidth="9" markerHeight="9" refX="6.2" refY="3" orient="auto">
<path d="M0,0 L6.2,3 L0,6 Z" fill="#9a958a"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="268" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="36" style="fill:#3d3d3a">vanna rally인가, 그냥 재레버리징인가</text>

<rect x="34" y="98" width="118" height="74" rx="10" fill="#fff" stroke="#5b6b86" stroke-width="1.3"/>
<text class="nm" x="93" y="130" text-anchor="middle" style="fill:#3f4d66">변동성 ↓</text>
<text class="d" x="93" y="150" text-anchor="middle">(vol 압축)</text>

<rect x="212" y="68" width="258" height="54" rx="10" fill="#fff" stroke="#2f6fed" stroke-width="1.3"/>
<text class="nm" x="228" y="92" style="fill:#2f6fed">딜러 바나 헷지</text>
<text class="d" x="228" y="111">풋 델타 축소 → 현물 되사기</text>

<rect x="212" y="148" width="258" height="54" rx="10" fill="#fff" stroke="#e0870b" stroke-width="1.3"/>
<text class="nm" x="228" y="172" style="fill:#b5700a">변동성 타깃 펀드</text>
<text class="d" x="228" y="191">vol drag ↓ → 기계적 주식 매수</text>

<rect x="528" y="98" width="118" height="74" rx="10" fill="#fff" stroke="#1d9e75" stroke-width="1.3"/>
<text class="nm" x="587" y="140" text-anchor="middle" style="fill:#158a63">지수 ↑</text>

<line x1="152" y1="126" x2="208" y2="98" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar1)"/>
<line x1="152" y1="144" x2="208" y2="172" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar1)"/>
<line x1="470" y1="98" x2="526" y2="126" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar1)"/>
<line x1="470" y1="172" x2="526" y2="144" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar1)"/>

<text class="note" x="341" y="139" text-anchor="middle" style="fill:#b23a2c">겹침</text>

<rect x="40" y="222" width="600" height="30" rx="8" fill="#f7dcd6" stroke="#d84a3a" stroke-width="1"/>
<text class="d" x="340" y="241" text-anchor="middle" style="fill:#8a3a2c">방향·타이밍이 겹쳐 어느 쪽이 밀었는지 구분 불가 — 규모론 오히려 시스템 자금이 더 클 수도</text>
</svg>
