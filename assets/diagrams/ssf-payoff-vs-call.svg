<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>만기 손익 비교 — SSF 롱과 콜 매수</title>
<desc>만기 주가에 따른 손익 곡선. SSF는 직선으로 위아래 모두 무제한이며 주가 170달러에서 증거금 전액을 잃는다. 콜 매수는 프리미엄 700달러에서 손실이 멈추는 바닥이 있고 손익분기점은 207달러다.</desc>
<style>
:root { --tp:#3d3d3a; --ts:#73726c; --br:#d6d3c8; }
text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.th { font-size:14px; font-weight:500; fill:var(--tp); }
.s { font-size:12px; font-weight:400; fill:var(--ts); }
.ax { stroke:var(--br); stroke-width:0.5; }
.ld { stroke:var(--ts); stroke-width:0.5; stroke-dasharray:2 3; opacity:0.7; }
</style>
<rect x="0" y="0" width="680" height="430" rx="12" fill="#FAF8F2"/>

<text class="s" x="40" y="42">손익 (계약 1개 = 100주 기준)</text>

<line class="ax" x1="90" y1="60" x2="90" y2="340"/>
<line class="ax" x1="90" y1="200" x2="628" y2="200"/>

<text class="s" x="80" y="64" text-anchor="end">+$4,000</text>
<text class="s" x="80" y="204" text-anchor="end">$0</text>
<text class="s" x="80" y="344" text-anchor="end">−$4,000</text>

<line class="ax" x1="355" y1="60" x2="355" y2="340" stroke-dasharray="4 4" opacity="0.6"/>
<line x1="156" y1="200" x2="156" y2="340" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.6"/>

<path d="M90,340 L620,60" fill="none" stroke="#1D9E75" stroke-width="2.5" stroke-linecap="round"/>
<path d="M90,224.5 L355,224.5 L620,84.5" fill="none" stroke="#D85A30" stroke-width="2.5" stroke-linecap="round"/>

<circle cx="156" cy="305" r="4" fill="#D85A30"/>
<circle cx="401" cy="200" r="4" fill="#D85A30"/>

<line class="ld" x1="156" y1="305" x2="196" y2="322"/>
<text class="th" x="202" y="318">$170 — 증거금 전액 소멸</text>
<text class="s" x="202" y="336">−15% 갭 하나로 $3,000 전액</text>

<line class="ld" x1="401" y1="200" x2="432" y2="168"/>
<text class="th" x="438" y="164">$207</text>
<text class="s" x="438" y="182">콜 손익분기</text>

<line class="ld" x1="240" y1="224.5" x2="240" y2="262"/>
<text class="th" x="196" y="282">−$700 에서 멈춤</text>
<text class="s" x="196" y="300">콜 매수의 손실 하한</text>

<text class="th" x="596" y="76" text-anchor="end">SSF 롱</text>
<text class="th" x="596" y="106" text-anchor="end">콜 매수</text>

<text class="s" x="90" y="366">만기 주가 $160</text>
<text class="s" x="355" y="366" text-anchor="middle">$200 (진입)</text>
<text class="s" x="620" y="366" text-anchor="end">$240</text>

<rect x="90" y="388" width="10" height="10" rx="2" fill="#1D9E75" opacity="0.85"/>
<text class="s" x="108" y="398">SSF — 직선, 위아래 모두 하한 없음</text>
<rect x="360" y="388" width="10" height="10" rx="2" fill="#D85A30" opacity="0.85"/>
<text class="s" x="378" y="398">콜 매수 — 프리미엄에서 꺾이는 바닥</text>
</svg>
