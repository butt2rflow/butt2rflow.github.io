<text class="m" x="374" y="80">1mm 칸마다</text>
<text class="s" x="374" y="95">여러 뷰의 점 높이 중 70번째 백분위</text>
<circle cx="362" cy="118" r="4" fill="#16a34a"/>
<text class="m" x="374" y="122">윤곽은 위에서 본 뷰로만</text>
<text class="s" x="374" y="137">65° 이상 가파른 뷰 · 옆 뷰는 윤곽을 부풀린다</text>
<circle cx="362" cy="160" r="4" fill="#16a34a"/>
<text class="m" x="374" y="164">가장자리 8px 깎기</text>
<text class="s" x="374" y="179">마스크 번짐 + 스테레오 가장자리 부풂 방지</text>
<text class="g" x="40" y="232">결과: 100 × 66 × 29.7mm (실물 100 × 62 × 34mm) · 4.5초</text>
</svg>
