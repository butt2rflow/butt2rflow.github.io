<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>스펙은 쌍둥이, 갈리는 건 개방성</title>
<desc>가반하중·리치·반복정밀도에서 UR10e와 화낙 CRX-10iA/L은 거의 같다. 그런데 외부 개방성(RTDE·외부 힘 제어)에서는 UR이 크게 앞서고 화낙은 뒤처진다 — 승부는 스펙이 아니라 여기서 갈린다.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.h{font-size:15px;font-weight:700;}
.m{font-size:12.5px;font-weight:700;fill:#3d3d3a;}
.s{font-size:11px;fill:#73726c;}
.tag{font-size:11px;font-weight:700;}
.leg{font-size:11px;font-weight:600;}
</style>
<rect x="0" y="0" width="680" height="330" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="38" style="fill:#3d3d3a">스펙은 쌍둥이, 갈리는 건 개방성</text>

<!-- legend -->
<rect x="430" y="26" width="12" height="12" rx="2" style="fill:#2f6fed"/>
<text class="leg" x="448" y="36" style="fill:#2f6fed">UR10e</text>
<rect x="520" y="26" width="12" height="12" rx="2" style="fill:#e0870b"/>
<text class="leg" x="538" y="36" style="fill:#b5700a">화낙 CRX</text>

<!-- rows: bars from x=200, max width 300 -->
<!-- 가반하중 -->
<text class="m" x="40" y="76">가반하중</text>
<rect x="200" y="62" width="300" height="11" rx="3" style="fill:#2f6fed"/>
<rect x="200" y="76" width="240" height="11" rx="3" style="fill:#e0870b"/>
<text class="tag" x="620" y="78" text-anchor="end" style="fill:#15803d">≈ 동급</text>

<!-- 리치 -->
<text class="m" x="40" y="120">리치</text>
<rect x="200" y="106" width="300" height="11" rx="3" style="fill:#2f6fed"/>
<rect x="200" y="120" width="288" height="11" rx="3" style="fill:#e0870b"/>
<text class="tag" x="620" y="122" text-anchor="end" style="fill:#15803d">≈ 동급</text>

<!-- 반복정밀도 -->
<text class="m" x="40" y="164">반복정밀도</text>
<rect x="200" y="150" width="270" height="11" rx="3" style="fill:#2f6fed"/>
<rect x="200" y="164" width="272" height="11" rx="3" style="fill:#e0870b"/>
<text class="tag" x="620" y="166" text-anchor="end" style="fill:#15803d">≈ 동급</text>

<!-- divider -->
<line x1="40" y1="196" x2="640" y2="196" stroke="#e0ddd3" stroke-width="1" stroke-dasharray="4 3"/>

<!-- 외부 개방성 -->
<text class="m" x="40" y="238" style="fill:#a9791f">외부 개방성</text>
<text class="s" x="40" y="254">RTDE·힘 외부제어</text>
<rect x="200" y="224" width="300" height="11" rx="3" style="fill:#2f6fed"/>
<rect x="200" y="238" width="66" height="11" rx="3" style="fill:#e0870b"/>
<text class="tag" x="620" y="240" text-anchor="end" style="fill:#b23a2c">✕ 큰 격차</text>

<text class="m" x="40" y="300" style="fill:#3d3d3a">팔은 거의 같다. 승부는 '얼마나 열려 있느냐'에서 갈린다.</text>
</svg>
