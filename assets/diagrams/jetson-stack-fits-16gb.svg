<svg width="100%" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img">
<title>개방어휘 4모델 체인이 16GB 예산 안에 동시 상주</title>
<desc>스테레오 깊이(FoundationStereo)·검출(SyntheticaDETR)·마스크(SAM2)·자세(FoundationPose) 네 모델을 동시에 상주시켰을 때 피크 메모리가 8.2GB로, 사용가능 15.6GB 예산 안에 7.4GB 여유를 두고 들어온다. 각 모델이 따로 되는 것을 넘어 함께 올려도 16GB 안이다.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.h{font-size:15px;font-weight:700;fill:#3d3d3a;}
.m{font-size:11px;font-weight:700;fill:#3f4d66;}
.s{font-size:9.5px;fill:#73726c;}
.fill{font-size:11px;font-weight:700;fill:#ffffff;}
.free{font-size:11px;font-weight:700;fill:#5f6b57;}
.ax{font-size:9.5px;fill:#73726c;}
</style>
<rect x="0" y="0" width="680" height="200" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="30">개방어휘 4모델, 16GB 예산 안에 동시 상주</text>

<!-- pipeline chips -->
<rect x="40" y="48" width="135" height="42" rx="8" fill="#fff" stroke="#5b6b86" stroke-width="1.1"/>
<text class="m" x="52" y="70">깊이</text>
<text class="s" x="52" y="85">FoundationStereo</text>
<path d="M177 69 L193 69" stroke="#9a988f" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="195" y="48" width="135" height="42" rx="8" fill="#fff" stroke="#5b6b86" stroke-width="1.1"/>
<text class="m" x="207" y="70">검출</text>
<text class="s" x="207" y="85">SyntheticaDETR</text>
<path d="M332 69 L348 69" stroke="#9a988f" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="350" y="48" width="135" height="42" rx="8" fill="#fff" stroke="#5b6b86" stroke-width="1.1"/>
<text class="m" x="362" y="70">마스크</text>
<text class="s" x="362" y="85">SAM2</text>
<path d="M487 69 L503 69" stroke="#9a988f" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="505" y="48" width="135" height="42" rx="8" fill="#fff" stroke="#5b6b86" stroke-width="1.1"/>
<text class="m" x="517" y="70">자세</text>
<text class="s" x="517" y="85">FoundationPose</text>

<!-- memory budget bar -->
<text class="ax" x="40" y="116">메모리 예산 · 통합 16GB (사용가능 15.6GB)</text>
<rect x="40" y="124" width="600" height="28" rx="6" fill="#ece9e0"/>
<rect x="40" y="124" width="315" height="28" rx="6" fill="#16a34a"/>
<rect x="345" y="124" width="10" height="28" fill="#16a34a"/>
<text class="fill" x="197" y="142" text-anchor="middle">4모델 동시 · 8.2GB</text>
<text class="free" x="497" y="142" text-anchor="middle">여유 7.4GB</text>
<text class="ax" x="40" y="170">0</text>
<text class="ax" x="640" y="170" text-anchor="end">15.6GB</text>

<text class="s" x="40" y="190">각 모델이 따로 되는 걸 넘어 — 넷을 동시에 올려도 16GB 안. (측정 피크)</text>

<defs><marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#9a988f"/></marker></defs>
</svg>
