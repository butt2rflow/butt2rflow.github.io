<svg width="100%" viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">펜던트의 관절 화면과 ros2 topic echo</title>
<desc id="de">왼쪽은 티치 펜던트의 현재 위치(관절) 화면으로 관절 각도를 도 단위로 보여 준다. 오른쪽은 같은 자세를 ros2 topic echo /joint_states로 본 결과로, 관절 이름과 라디안 값이 나온다. 가운데 화살표는 도에 원주율을 곱하고 180으로 나누면 라디안이 된다는 변환을 나타낸다.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--chip:#f3efe4;--term:#1f2430;--termfg:#d6dbe5;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--chip:#26251e;--term:#0e1016;--termfg:#d6dbe5;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:14px;font-weight:700}
.lb{font-size:12.5px;font-weight:700}
.st{font-size:11px;fill:var(--mut)}
.code{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px}
.pend{fill:var(--chip);stroke:var(--amber);stroke-width:1.6}
.term{fill:var(--term);stroke:none}
.tc{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px;fill:var(--termfg)}
.tg{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px;fill:#7ee0a0}
.ar{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.mk{fill:var(--blue)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="680" height="270" rx="12"/>
<text class="t" x="18" y="26">같은 정보, 다른 화면</text>
<text class="lb" x="30" y="52" style="fill:var(--amber)">펜던트: 현재 위치(관절)</text>
<rect class="pend" x="24" y="62" width="230" height="160" rx="10"/>
<text class="code" x="42" y="90" style="font-weight:700">관절</text>
<text class="code" x="206" y="90" text-anchor="end" style="font-weight:700">각도</text>
<text class="code" x="42" y="116">J1</text><text class="code" x="206" y="116" text-anchor="end">0.0°</text>
<text class="code" x="42" y="140">J2</text><text class="code" x="206" y="140" text-anchor="end">-90.0°</text>
<text class="code" x="42" y="164">J3</text><text class="code" x="206" y="164" text-anchor="end">90.0°</text>
<text class="code" x="42" y="188">...</text>
<text class="st" x="42" y="210">단위: 도(°)</text>
<line class="ar" x1="262" y1="142" x2="330" y2="142"/>
<text class="st" x="296" y="128" text-anchor="middle">° × π / 180</text>
<text class="st" x="296" y="162" text-anchor="middle">-90° → -1.571</text>
<text class="lb" x="346" y="52" style="fill:var(--blue)">ROS 2: 터미널</text>
<rect class="term" x="338" y="62" width="318" height="160" rx="10"/>
<text class="tg" x="352" y="88">$ ros2 topic echo /joint_states --once</text>
<text class="tc" x="352" y="114">name:</text>
<text class="tc" x="362" y="132">- shoulder_pan_joint</text>
<text class="tc" x="362" y="148">- shoulder_lift_joint</text>
<text class="tc" x="362" y="164">- elbow_joint ...</text>
<text class="tc" x="352" y="186">position: [0.0, -1.571,</text>
<text class="tc" x="362" y="204">1.571, ...]    # 라디안</text>
<text class="st" x="346" y="242">관절을 번호 대신 이름으로 부른다.</text>
<text class="st" x="346" y="256">이름은 로봇 모델 파일(2부)에 적혀 있다.</text>
</svg>
