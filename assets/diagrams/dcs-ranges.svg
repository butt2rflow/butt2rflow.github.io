<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">카메라별 권장 구간과 손목 작업 거리</title>
<desc id="de">로그 눈금 가로축에 카메라별 권장 동작 구간을 막대로 그렸다. 손목 작업 거리 15~40cm 띠를 통째로 포함하는 것은 D405와 Gemini 305(근거리 설정에서 최소 4~5cm)다. OAK-D SR은 약 20~30cm부터, D435는 30cm부터, D455는 60cm부터, OAK-D Pro는 기본 설정에서 약 80cm부터라 손목 근거리에는 맞지 않고 오버헤드나 큰 팔에 맞는다.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--green:#15803d;--chip:#f3efe4;--term:#1f2430;--termfg:#d6dbe5;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--green:#4ade80;--chip:#26251e;--term:#0e1016;--termfg:#d6dbe5;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:14px;font-weight:700}
.lb{font-size:12.5px;font-weight:700}
.nd{font-size:11.5px;font-weight:600}
.it{font-size:12px;font-weight:600}
.st{font-size:11px;fill:var(--mut)}
.sm{font-size:10px;fill:var(--mut)}
.code{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px}
.panel{fill:var(--bg);stroke:var(--bd);stroke-width:1}
.bx{fill:var(--card);stroke:var(--blue);stroke-width:1.4}
.bxg{fill:var(--card);stroke:var(--bd);stroke-width:1.2}
.bxa{fill:var(--card);stroke:var(--amber);stroke-width:1.6}
.bxt{fill:var(--card);stroke:var(--teal);stroke-width:1.8}
.bxr{fill:var(--card);stroke:var(--red);stroke-width:1.6}
.bxgr{fill:var(--card);stroke:var(--green);stroke-width:1.8}
.hi{fill:var(--chip);stroke:var(--amber);stroke-width:1.8}
.ctl{fill:var(--bg);stroke:var(--mut);stroke-width:1.3;stroke-dasharray:5 4}
.fam{fill:var(--chip);stroke:none}
.obs{fill:var(--chip);stroke:var(--mut);stroke-width:1.2}
.term{fill:var(--term);stroke:none}
.tc{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px;fill:var(--termfg)}
.tg{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px;fill:#7ee0a0}
.tr{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px;fill:#ff8a8a}
.dim{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px;fill:#8a93a6}
.ar{stroke:var(--blue);stroke-width:1.5;fill:none;marker-end:url(#ah)}
.ara{stroke:var(--amber);stroke-width:1.5;fill:none;marker-end:url(#aa)}
.art{stroke:var(--teal);stroke-width:1.6;fill:none;marker-end:url(#at)}
.arg{stroke:var(--mut);stroke-width:1.4;fill:none;marker-end:url(#ag)}
.arr{stroke:var(--red);stroke-width:1.5;fill:none;marker-end:url(#ar)}
.ln{stroke:var(--mut);stroke-width:1.3;fill:none}
.lnb{stroke:var(--blue);stroke-width:3;fill:none;stroke-linecap:round}
.lna{stroke:var(--amber);stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:6 4}
.dash{stroke-dasharray:4 3}
.jt{fill:var(--card);stroke:var(--blue);stroke-width:1.6}
.dot{fill:var(--blue)}
.dota{fill:var(--amber)}
.dott{fill:var(--teal)}
.dotr{fill:var(--red)}
.sph{fill:none;stroke:var(--teal);stroke-width:1.3}
.mk{fill:var(--blue)}.mka{fill:var(--amber)}.mkt{fill:var(--teal)}.mkg{fill:var(--mut)}.mkr{fill:var(--red)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mka"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkt"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkg"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkr"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="680" height="320" rx="12"/>
<text class="t" x="18" y="26">손목 15~40cm를 통째로 담는 건 근거리형뿐</text>
<rect x="327.4" y="44" width="77.7" height="206" style="fill:var(--amber);opacity:0.14"/>
<text class="sm" x="366.2779121675859" y="56" text-anchor="middle" style="fill:var(--amber);font-weight:700">손목 15~40cm</text>
<text class="nd" x="18" y="79">RealSense D405 · 18mm</text>
<rect class="bxgr" x="267.09372043827835" y="66" width="155.68766605323532" height="18" rx="4"/>
<text class="sm" x="428.7813864915137" y="79" style="fill:var(--fg)">7~50cm</text>
<text class="nd" x="18" y="109">Orbbec Gemini 305 · 18mm</text>
<rect x="222.8" y="98" width="44.3" height="14" rx="3" style="fill:none;stroke:var(--mut);stroke-width:1.2;stroke-dasharray:3 3"/>
<rect class="bxgr" x="267.09372043827835" y="96" width="155.68766605323532" height="18" rx="4"/>
<text class="sm" x="428.7813864915137" y="109" style="fill:var(--fg)">7~50cm (근거리 설정 4cm~)</text>
<text class="nd" x="18" y="139">Luxonis OAK-D SR · 20mm</text>
<rect x="350.2" y="128" width="32.1" height="14" rx="3" style="fill:none;stroke:var(--mut);stroke-width:1.2;stroke-dasharray:3 3"/>
<rect class="bx" x="382.33139458665727" y="126" width="95.33721082668552" height="18" rx="4"/>
<text class="sm" x="483.6686054133428" y="139" style="fill:var(--fg)">0.3~1m</text>
<text class="nd" x="18" y="169">RealSense D435 · 50mm</text>
<rect class="bx" x="382.33139458665727" y="156" width="182.33139458665727" height="18" rx="4"/>
<text class="sm" x="570.6627891733145" y="169" style="fill:var(--fg)">0.3~3m</text>
<text class="nd" x="18" y="199">RealSense D455 · 95mm</text>
<rect class="bx" x="437.2186135084863" y="186" width="182.3313945866572" height="18" rx="4"/>
<text class="sm" x="613.5500080951435" y="199" text-anchor="end" style="fill:var(--fg)">0.6~6m</text>
<text class="nd" x="18" y="229">Luxonis OAK-D Pro · 75mm</text>
<rect x="350.2" y="218" width="109.8" height="14" rx="3" style="fill:none;stroke:var(--mut);stroke-width:1.2;stroke-dasharray:3 3"/>
<rect class="bx" x="459.99886759217276" y="216" width="200.00113240782724" height="18" rx="4"/>
<text class="sm" x="654.0" y="229" text-anchor="end" style="fill:var(--fg)">기본 약 0.8m~</text>
<line x1="240.4" y1="250" x2="240.4" y2="255" style="stroke:var(--mut);stroke-width:1"/>
<text class="sm" x="240.4499919048564" y="268" text-anchor="middle">5cm</text>
<line x1="295.3" y1="250" x2="295.3" y2="255" style="stroke:var(--mut);stroke-width:1"/>
<text class="sm" x="295.3372108266855" y="268" text-anchor="middle">10cm</text>
<line x1="382.3" y1="250" x2="382.3" y2="255" style="stroke:var(--mut);stroke-width:1"/>
<text class="sm" x="382.33139458665727" y="268" text-anchor="middle">30cm</text>
<line x1="477.7" y1="250" x2="477.7" y2="255" style="stroke:var(--mut);stroke-width:1"/>
<text class="sm" x="477.6686054133428" y="268" text-anchor="middle">1m</text>
<line x1="564.7" y1="250" x2="564.7" y2="255" style="stroke:var(--mut);stroke-width:1"/>
<text class="sm" x="564.6627891733145" y="268" text-anchor="middle">3m</text>
<line x1="660.0" y1="250" x2="660.0" y2="255" style="stroke:var(--mut);stroke-width:1"/>
<text class="sm" x="660.0" y="268" text-anchor="middle">10m</text>
<line x1="200" y1="250" x2="660" y2="250" style="stroke:var(--mut);stroke-width:1"/>
<text class="sm" x="18" y="290">점선: 해상도를 낮추거나 탐색 범위를 옮겨야 닿는 거리(대신 먼 쪽이 줄어듦)</text>
<text class="sm" x="18" y="306">대략값. 해상도·설정·펌웨어에 따라 달라지니 사기 전에 제조사 사양으로 확인</text>
</svg>
