<svg width="100%" viewBox="0 0 680 236" xmlns="http://www.w3.org/2000/svg" role="img">
<title>델타를 움직이는 세 가지 — 가격·변동성·시간</title>
<desc>델타 헷지를 계속 움직이는 세 그릭: 감마는 현물 가격이 움직일 때(가격 페달), 바나는 변동성이 움직일 때(공포 페달), 참은 시간이 지나갈 때(모래시계 페달) 델타를 바꾼다.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.h{font-size:15px;font-weight:700;}
.nm{font-size:15px;font-weight:800;}
.d{font-size:12px;fill:#73726c;}
.tr{font-size:12.5px;font-weight:600;fill:#3d3d3a;}
.pd{font-size:11.5px;fill:#8a6d3b;}
</style>
<rect x="0" y="0" width="680" height="236" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="38" style="fill:#3d3d3a">델타를 움직이는 세 가지 — 가격·변동성·시간</text>

<rect x="40" y="60" width="185" height="140" rx="10" fill="#fff" stroke="#2f6fed" stroke-width="1.3"/>
<text class="nm" x="60" y="92" style="fill:#2f6fed">감마 Gamma</text>
<text class="d" x="60" y="112">∂델타 / ∂현물</text>
<text class="tr" x="60" y="142">현물 가격이 움직임</text>
<text class="pd" x="60" y="176">「가격 페달」</text>

<rect x="247" y="60" width="185" height="140" rx="10" fill="#fff" stroke="#e0870b" stroke-width="1.3"/>
<text class="nm" x="267" y="92" style="fill:#b5700a">바나 Vanna</text>
<text class="d" x="267" y="112">∂델타 / ∂변동성</text>
<text class="tr" x="267" y="142">변동성이 움직임</text>
<text class="pd" x="267" y="176">「공포 페달」</text>

<rect x="454" y="60" width="186" height="140" rx="10" fill="#fff" stroke="#5b6b86" stroke-width="1.3"/>
<text class="nm" x="474" y="92" style="fill:#3f4d66">참 Charm</text>
<text class="d" x="474" y="112">∂델타 / ∂시간</text>
<text class="tr" x="474" y="142">시간이 지나감</text>
<text class="pd" x="474" y="176">「모래시계 페달」</text>
</svg>
