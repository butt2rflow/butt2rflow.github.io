<svg width="100%" viewBox="0 0 360 254" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">포즈 가설 샘플링</title>
<desc id="de">구면 위 시점 42개에 각 시점마다 면내 회전 12번을 곱해 약 500개 회전 가설을 뿌린다. 위치는 마스크 중심과 깊이 중앙값으로 초기화한다.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="254" rx="12"/>
<text class="t" x="18" y="22">회전은 '어디서 보는가' × '얼마나 기울었나'</text>
<circle cx="90" cy="118" r="52" fill="none" stroke="var(--bd)" stroke-width="1.2"/>
<ellipse cx="90" cy="118" rx="52" ry="18" fill="none" stroke="var(--bd)" stroke-width="1" stroke-dasharray="3 3"/>
<g class="hi3">
<circle cx="90" cy="66" r="3.2"/><circle cx="130" cy="86" r="3.2"/><circle cx="142" cy="118" r="3.2"/>
<circle cx="130" cy="150" r="3.2"/><circle cx="90" cy="170" r="3.2"/><circle cx="50" cy="150" r="3.2"/>
<circle cx="38" cy="118" r="3.2"/><circle cx="50" cy="86" r="3.2"/><circle cx="90" cy="100" r="3.2"/>
<circle cx="112" cy="128" r="3.2"/><circle cx="68" cy="128" r="3.2"/>
</g>
<rect x="82" y="110" width="16" height="16" rx="2" fill="var(--mut)" opacity=".5"/>
<text class="lb" x="90" y="200" text-anchor="middle">① 구면 위 시점 42개</text>
<text class="lb" x="90" y="216" text-anchor="middle">정이십면체 세분 — 고르게</text>
<text class="lb" x="252" y="52" text-anchor="middle">② 각 시점마다</text>
<text class="lb" x="252" y="68" text-anchor="middle">카메라를 12번 굴린다</text>
<g>
<circle cx="252" cy="118" r="34" fill="none" stroke="var(--bd)"/>
<path class="ln" d="M252,118 L252,88" stroke="var(--blue)"/>
<path class="ln" d="M252,118 L277,103" stroke="var(--blue)" opacity=".6"/>
<path class="ln" d="M252,118 L277,133" stroke="var(--blue)" opacity=".45"/>
<path class="ln" d="M252,118 L252,148" stroke="var(--blue)" opacity=".35"/>
<path class="ln" d="M252,118 L227,133" stroke="var(--blue)" opacity=".3"/>
<path class="ln" d="M252,118 L227,103" stroke="var(--blue)" opacity=".3"/>
</g>
<text class="lb" x="252" y="200" text-anchor="middle">면내 회전 30°씩</text>
<text class="lb" x="180" y="240" text-anchor="middle" style="fill:var(--amber)">42 × 12 ≈ 500개 · 위치는 마스크 중심 + 깊이 중앙값으로 초기화</text>
</svg>
