<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>산업용 로봇 vs 협동로봇 — 가두느냐, 힘을 제한하느냐</title>
<desc>왼쪽은 산업용 로봇: 빠르고 힘세지만 위험해 안전 펜스 안에 갇혀 있고 사람은 펜스 밖에 있다. 오른쪽은 협동로봇: 힘과 속도를 스스로 제한해 펜스 없이 사람 바로 옆에서 함께 일한다.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.h{font-size:14px;font-weight:600;}
.s{font-size:12px;}
.n{font-size:15px;font-weight:700;}
</style>
<rect x="0" y="0" width="680" height="300" rx="12" fill="#FAF8F2"/>

<!-- LEFT: industrial -->
<rect x="40" y="52" width="280" height="196" rx="10" fill="#fff" stroke="#d6d3c8" stroke-width="1"/>
<text class="n" x="180" y="80" text-anchor="middle" style="fill:#d84a3a">산업용 로봇</text>
<!-- fence (dashed) -->
<rect x="70" y="98" width="220" height="118" rx="4" fill="none" stroke="#d84a3a" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.8"/>
<!-- robot arm inside -->
<g stroke="#5c6675" stroke-width="5" stroke-linecap="round" fill="none">
<line x1="120" y1="200" x2="120" y2="160"/>
<line x1="120" y1="160" x2="160" y2="135"/>
<line x1="160" y1="135" x2="200" y2="150"/>
</g>
<circle cx="120" cy="200" r="7" fill="#5c6675"/>
<rect x="196" y="146" width="12" height="9" rx="2" fill="#5c6675"/>
<!-- person OUTSIDE fence -->
<circle cx="55" cy="150" r="8" fill="#8a94a4"/>
<line x1="55" y1="158" x2="55" y2="182" stroke="#8a94a4" stroke-width="4" stroke-linecap="round"/>
<text class="s" x="180" y="236" text-anchor="middle" style="fill:#73726c">펜스 안 · 빠름·힘셈·위험</text>

<!-- RIGHT: cobot -->
<rect x="360" y="52" width="280" height="196" rx="10" fill="#fff" stroke="#d6d3c8" stroke-width="1"/>
<text class="n" x="500" y="80" text-anchor="middle" style="fill:#16a34a">협동로봇 (코봇)</text>
<!-- robot arm, no fence -->
<g stroke="#5c6675" stroke-width="5" stroke-linecap="round" fill="none">
<line x1="470" y1="200" x2="470" y2="160"/>
<line x1="470" y1="160" x2="510" y2="135"/>
<line x1="510" y1="135" x2="548" y2="152"/>
</g>
<circle cx="470" cy="200" r="7" fill="#5c6675"/>
<rect x="544" y="148" width="12" height="9" rx="2" fill="#5c6675"/>
<!-- safe glow -->
<circle cx="510" cy="150" r="46" fill="#16a34a" opacity="0.08"/>
<!-- person RIGHT NEXT, hand on arm -->
<circle cx="588" cy="150" r="8" fill="#16a34a"/>
<line x1="588" y1="158" x2="588" y2="182" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
<line x1="588" y1="164" x2="556" y2="152" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
<text class="s" x="500" y="236" text-anchor="middle" style="fill:#73726c">펜스 없이 · 힘·속도 제한</text>
</svg>
