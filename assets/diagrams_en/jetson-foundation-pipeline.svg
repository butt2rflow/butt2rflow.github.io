<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The foundation pipeline — perception vs. motion, and the one stage where "no training" lives</title>
<desc>Depth (FoundationStereo) and a mask (SAM 2) feed FoundationPose, which produces a 6-DoF pose; that pose goes to cuMotion for a collision-free path. Only FoundationPose takes a CAD input, and "new part, no training" is a claim about this one stage. The first three stages are perception; cuMotion is motion.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.h{font-size:15px;font-weight:700;fill:#3d3d3a;}
.t{font-size:13px;font-weight:700;fill:#3d3d3a;}
.s{font-size:10.5px;fill:#73726c;}
.lb{font-size:11px;fill:#73726c;}
.hl{font-size:11px;font-weight:700;fill:#15803d;}
</style>
<rect x="0" y="0" width="680" height="300" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="38">The foundation pipeline — where "no training" lives</text>

<!-- FoundationStereo -->
<rect x="40" y="72" width="150" height="52" rx="8" fill="#fff" stroke="#c9c6bc" stroke-width="1"/>
<text class="t" x="52" y="94">FoundationStereo</text>
<text class="s" x="52" y="111">depth (how far)</text>
<!-- SAM 2 -->
<rect x="40" y="150" width="150" height="52" rx="8" fill="#fff" stroke="#c9c6bc" stroke-width="1"/>
<text class="t" x="52" y="172">SAM 2</text>
<text class="s" x="52" y="189">mask (which pixels)</text>

<!-- FoundationPose (star) -->
<rect x="268" y="104" width="172" height="70" rx="9" fill="#e3f6ea" stroke="#16a34a" stroke-width="1.4"/>
<text class="t" x="284" y="132" style="fill:#15803d">FoundationPose</text>
<text class="s" x="284" y="150">6-DoF pose (where in 3D)</text>
<text class="hl" x="284" y="166">← new part, no training</text>

<!-- CAD input badge -->
<rect x="300" y="46" width="118" height="34" rx="7" fill="#fdf1dc" stroke="#c9a24a" stroke-width="1.3" stroke-dasharray="5 3"/>
<text class="s" x="359" y="60" text-anchor="middle" style="fill:#a9791f;font-weight:700">CAD input</text>
<text class="s" x="359" y="74" text-anchor="middle" style="fill:#a9791f">no training · CAD only</text>
<line x1="359" y1="80" x2="359" y2="104" stroke="#c9a24a" stroke-width="1.6" stroke-dasharray="4 3"/>
<path d="M354,96 L359,104 L364,96" fill="none" stroke="#c9a24a" stroke-width="1.6"/>

<!-- cuMotion -->
<rect x="512" y="112" width="128" height="54" rx="8" fill="#eef1f6" stroke="#5b6b86" stroke-width="1.2"/>
<text class="t" x="524" y="134" style="fill:#3f4d66">cuMotion</text>
<text class="s" x="524" y="151">collision-free path</text>

<!-- arrows: stereo/sam -> pose -->
<line x1="190" y1="98" x2="262" y2="128" stroke="#8a8a82" stroke-width="1.6"/>
<path d="M253,122 L262,128 L252,132" fill="none" stroke="#8a8a82" stroke-width="1.6"/>
<line x1="190" y1="176" x2="262" y2="150" stroke="#8a8a82" stroke-width="1.6"/>
<path d="M252,146 L262,150 L253,157" fill="none" stroke="#8a8a82" stroke-width="1.6"/>
<!-- pose -> cuMotion -->
<line x1="440" y1="139" x2="506" y2="139" stroke="#8a8a82" stroke-width="1.8"/>
<path d="M497,134 L506,139 L497,144" fill="none" stroke="#8a8a82" stroke-width="1.8"/>

<!-- perception vs motion band -->
<line x1="40" y1="228" x2="440" y2="228" stroke="#c9c6bc" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="512" y1="228" x2="640" y2="228" stroke="#c9c6bc" stroke-width="1" stroke-dasharray="3 3"/>
<text class="lb" x="240" y="248" text-anchor="middle">perception</text>
<text class="lb" x="576" y="248" text-anchor="middle">motion</text>

<text class="s" x="40" y="282" style="fill:#8a6d3b">Call it a "zero-shot pipeline" all you like — only FoundationPose takes a CAD. The real magic is here.</text>
</svg>
