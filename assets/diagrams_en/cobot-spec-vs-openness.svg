<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Specs are twins; openness is what splits them</title>
<desc>On payload, reach, and repeatability, UR10e and FANUC CRX-10iA/L are nearly identical. But on external openness (RTDE and external force control) UR is far ahead and FANUC lags — the contest is decided not by specs but here.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.h{font-size:15px;font-weight:700;}
.m{font-size:12px;font-weight:700;fill:#3d3d3a;}
.s{font-size:10.5px;fill:#73726c;}
.tag{font-size:11px;font-weight:700;}
.leg{font-size:11px;font-weight:600;}
</style>
<rect x="0" y="0" width="680" height="330" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="38" style="fill:#3d3d3a">Specs are twins; openness is what splits them</text>

<rect x="430" y="26" width="12" height="12" rx="2" style="fill:#2f6fed"/>
<text class="leg" x="448" y="36" style="fill:#2f6fed">UR10e</text>
<rect x="520" y="26" width="12" height="12" rx="2" style="fill:#e0870b"/>
<text class="leg" x="538" y="36" style="fill:#b5700a">FANUC CRX</text>

<text class="m" x="40" y="76">Payload</text>
<rect x="200" y="62" width="300" height="11" rx="3" style="fill:#2f6fed"/>
<rect x="200" y="76" width="240" height="11" rx="3" style="fill:#e0870b"/>
<text class="tag" x="640" y="78" text-anchor="end" style="fill:#15803d">≈ tie</text>

<text class="m" x="40" y="120">Reach</text>
<rect x="200" y="106" width="300" height="11" rx="3" style="fill:#2f6fed"/>
<rect x="200" y="120" width="288" height="11" rx="3" style="fill:#e0870b"/>
<text class="tag" x="640" y="122" text-anchor="end" style="fill:#15803d">≈ tie</text>

<text class="m" x="40" y="164">Repeatability</text>
<rect x="200" y="150" width="270" height="11" rx="3" style="fill:#2f6fed"/>
<rect x="200" y="164" width="272" height="11" rx="3" style="fill:#e0870b"/>
<text class="tag" x="640" y="166" text-anchor="end" style="fill:#15803d">≈ tie</text>

<line x1="40" y1="196" x2="640" y2="196" stroke="#e0ddd3" stroke-width="1" stroke-dasharray="4 3"/>

<text class="m" x="40" y="238" style="fill:#a9791f">External openness</text>
<text class="s" x="40" y="254">RTDE · external force</text>
<rect x="200" y="224" width="300" height="11" rx="3" style="fill:#2f6fed"/>
<rect x="200" y="238" width="66" height="11" rx="3" style="fill:#e0870b"/>
<text class="tag" x="640" y="240" text-anchor="end" style="fill:#b23a2c">✕ big gap</text>

<text class="m" x="40" y="300" style="fill:#3d3d3a">The arms are nearly identical. The contest is decided by how open it is.</text>
</svg>
