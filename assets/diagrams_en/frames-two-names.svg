<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>One dot, seen from two frames</title>
<desc>Frame A's axes rise from a bottom-left origin. Frame B's axes are placed at (5,3) in A and turned 30 degrees. A single dot sits two units out along Frame B's x-axis. The same physical dot is (2,0) in Frame B and (6.732, 4.000) in Frame A — to convert, rotate then slide.</desc>
<style>
:root { --tp:#3d3d3a; --ts:#73726c; --br:#d6d3c8; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.h{font-size:14px;font-weight:600;fill:var(--tp);}
.s{font-size:12px;fill:var(--ts);}
.la{font-size:12px;font-weight:700;fill:#2f6fed;}
.lb{font-size:12px;font-weight:700;fill:#9333ea;}
.ans{font-size:12px;font-weight:700;fill:#0d9488;}
</style>
<rect x="0" y="0" width="680" height="300" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="34">One dot, seen from two frames</text>

<!-- Frame A axes -->
<line x1="90" y1="250" x2="90" y2="70" stroke="#9aa0a8" stroke-width="1.5"/>
<line x1="90" y1="250" x2="470" y2="250" stroke="#9aa0a8" stroke-width="1.5"/>
<text class="la" x="70" y="86">A</text>
<text class="s" x="70" y="266">A origin</text>

<!-- Frame B: origin at A(5,3) -> pixel; scale ~30px/unit. A origin (90,250). +x right, +y up. B origin at (5,3)=(240,160) -->
<!-- B axes rotated +30deg (screen: up is -y). B x-axis dir = (cos-30, ... ) draw pointing up-right -->
<g stroke="#9333ea" stroke-width="2">
<line x1="240" y1="160" x2="330" y2="108"/>
<line x1="240" y1="160" x2="188" y2="70"/>
</g>
<circle cx="240" cy="160" r="4" fill="#9333ea"/>
<text class="s" x="240" y="182" text-anchor="middle">Frame B (turned 30°)</text>

<!-- dot on B x-axis, 2 units out -->
<circle cx="285" cy="134" r="7" fill="#0d9488"/>
<line x1="285" y1="134" x2="360" y2="86" stroke="#9aa0a8" stroke-width="1" stroke-dasharray="3 3"/>
<text class="s" x="366" y="82">the dot — same spot, two names</text>

<!-- answer box -->
<rect x="486" y="96" width="164" height="120" rx="10" fill="#fff" stroke="var(--br)" stroke-width="1"/>
<text class="s" x="502" y="122">In Frame B:</text>
<text class="lb" x="502" y="142">(2, 0)</text>
<text class="s" x="502" y="170">In Frame A:</text>
<text class="ans" x="502" y="190">(6.732, 4.000)</text>
<text class="s" x="502" y="208" style="font-style:italic">rotate, then slide</text>
</svg>
