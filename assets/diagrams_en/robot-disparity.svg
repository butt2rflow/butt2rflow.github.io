<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Two eyes, one shift — disparity becomes depth</title>
<desc>The same object seen through a left lens and a right lens sits at slightly different horizontal positions; that shift is the disparity. A larger shift means the object is nearer. The disparity across the whole image is turned into a depth map, shown as a near-to-far colour bar.</desc>
<style>
:root { --tp:#3d3d3a; --ts:#73726c; --br:#d6d3c8; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.h{font-size:14px;font-weight:600;fill:var(--tp);}
.s{font-size:12px;fill:var(--ts);}
.lb{font-size:11px;font-weight:600;fill:var(--ts);}
.cap{font-size:11px;font-style:italic;fill:var(--ts);}
</style>
<rect x="0" y="0" width="680" height="280" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="34">Two eyes, one shift — disparity becomes depth</text>

<!-- scene panel: same object, two lens views -->
<rect x="48" y="66" width="380" height="164" rx="10" fill="#fff" stroke="var(--br)" stroke-width="1"/>
<text class="lb" x="66" y="90">same object · left lens vs right lens</text>

<!-- left-lens view (faint) -->
<circle cx="180" cy="150" r="18" fill="#2f6fed" opacity="0.28"/>
<text class="s" x="180" y="192" text-anchor="middle">left view</text>
<!-- right-lens view (solid) -->
<circle cx="264" cy="150" r="18" fill="#2f6fed"/>
<text class="s" x="264" y="192" text-anchor="middle">right view</text>
<!-- shift bracket -->
<line x1="180" y1="122" x2="264" y2="122" stroke="#0d9488" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="180" y1="116" x2="180" y2="128" stroke="#0d9488" stroke-width="1.4"/>
<line x1="264" y1="116" x2="264" y2="128" stroke="#0d9488" stroke-width="1.4"/>
<text class="cap" x="222" y="110" text-anchor="middle" fill="#0d9488">shift = disparity</text>

<!-- arrow -->
<text class="h" x="452" y="154" fill="var(--ts)">→</text>

<!-- depth bar -->
<defs>
<linearGradient id="dz" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#e0870b"/><stop offset="0.5" stop-color="#eab308"/><stop offset="1" stop-color="#2f6fed"/>
</linearGradient>
</defs>
<rect x="486" y="66" width="146" height="164" rx="10" fill="url(#dz)" stroke="var(--br)" stroke-width="1"/>
<text class="lb" x="559" y="90" text-anchor="middle" style="fill:#ffffff">DEPTH</text>
<text class="s" x="559" y="120" text-anchor="middle" style="fill:#ffffff">near</text>
<text class="s" x="559" y="212" text-anchor="middle" style="fill:#ffffff">far</text>
</svg>
