<svg width="100%" viewBox="0 0 680 348" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Time per object and pose error by chain variant</title>
<desc>Baseline 4.03 s (1.4°/3.4 mm); FoundationStereo swapped for ESS 2.11 s (2.0°/4.9 mm); detector also swapped for YOLO-World 1.66 s (2.2°/4.8 mm, research only because of its licence); a fixed box with no detector 1.52 s (2.0°/4.8 mm). Swapping the depth model gives the biggest win.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.h{font-size:15px;font-weight:700;fill:#3d3d3a;}
.sub{font-size:10.5px;fill:#73726c;}
.m{font-size:11.5px;font-weight:700;fill:#3f4d66;}
.s{font-size:9.5px;fill:#73726c;}
.v{font-size:10.5px;font-weight:700;fill:#5f5e58;}
.vg{font-size:10.5px;font-weight:700;fill:#15803d;}
.tot{font-size:12px;font-weight:700;fill:#3d3d3a;}
.tag{font-size:9.5px;font-weight:700;fill:#ffffff;}
.lane{font-size:12px;font-weight:700;fill:#3d3d3a;}
</style>
<rect x="0" y="0" width="680" height="348" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="32">What to swap, and how much faster it gets</text>
<text class="sub" x="40" y="50">seconds per object · one process · 4 live frames · right: worst error vs the verified pose</text>
<text class="s" x="560" y="74">worst error</text>
<text class="m" x="40" y="94">Baseline</text>
<text class="s" x="40" y="108">Grounding DINO + FoundationStereo + FoundationPose</text>
<rect x="40" y="116" width="443.3" height="14" rx="3" fill="#a8a69d"/>
<text class="v" x="491.3" y="127">4.03</text>
<text class="v" x="560" y="127">1.4° / 3.4mm</text>
<text class="m" x="40" y="158">Swap depth</text>
<text class="s" x="40" y="172">Grounding DINO + ESS + FoundationPose</text>
<rect x="40" y="180" width="232.1" height="14" rx="3" fill="#16a34a"/>
<text class="v" x="280.1" y="191">2.11</text>
<text class="v" x="560" y="191">2.0° / 4.9mm</text>
<text class="m" x="40" y="222">Swap detector too</text>
<text class="s" x="40" y="236">YOLO-World + ESS  (research only)</text>
<rect x="40" y="244" width="182.6" height="14" rx="3" fill="#d97706"/>
<text class="v" x="230.6" y="255">1.66</text>
<text class="v" x="560" y="255">2.2° / 4.8mm</text>
<text class="m" x="40" y="286">No detector</text>
<text class="s" x="40" y="300">Fixed box + ESS</text>
<rect x="40" y="308" width="167.2" height="14" rx="3" fill="#5b6b86"/>
<text class="v" x="215.2" y="319">1.52</text>
<text class="v" x="560" y="319">2.0° / 4.8mm</text>
</svg>
