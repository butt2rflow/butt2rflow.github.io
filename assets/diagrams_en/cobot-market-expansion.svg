<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Expansion, not replacement</title>
<desc>Cobots don't replace high-speed, high-volume lines — still the industrial robots' turf. They open a new territory beside it that automation didn't reach before: small and mid-size firms, high-mix low-volume production, and work right beside people.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.h{font-size:15px;font-weight:700;}
.zt{font-size:13.5px;font-weight:700;}
.s{font-size:11px;fill:#73726c;}
.it{font-size:12px;font-weight:600;fill:#3d3d3a;}
.big{font-size:13.5px;font-weight:700;}
</style>
<rect x="0" y="0" width="680" height="330" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="40" style="fill:#3d3d3a">Expansion, not replacement</text>

<circle cx="205" cy="175" r="98" fill="#eef1f6" stroke="#9aa0a8" stroke-width="1.3"/>
<text class="zt" x="205" y="150" text-anchor="middle" style="fill:#3f4d66">High-speed, high-volume</text>
<text class="s" x="205" y="172" text-anchor="middle">still the industrial robots' turf</text>
<text class="s" x="205" y="192" text-anchor="middle">(body welding, etc.)</text>
<text class="s" x="205" y="210" text-anchor="middle">already automated</text>

<circle cx="470" cy="175" r="115" fill="#e3f6ea" stroke="#16a34a" stroke-width="1.6"/>
<text class="zt" x="470" y="138" text-anchor="middle" style="fill:#15803d">The new ground cobots opened</text>
<text class="it" x="470" y="166" text-anchor="middle">· small &amp; mid-size firms</text>
<text class="it" x="470" y="186" text-anchor="middle">· high-mix, low-volume</text>
<text class="it" x="470" y="206" text-anchor="middle">· work beside people</text>
<text class="s" x="470" y="228" text-anchor="middle">where automation didn't pay before</text>

<text class="big" x="340" y="306" text-anchor="middle" style="fill:#3d3d3a">It doesn't take the existing lines — it opens a new market beside them</text>
</svg>
