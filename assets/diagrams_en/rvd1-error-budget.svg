<svg width="100%" viewBox="0 0 360 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">How Errors Stack Past Gripper Clearance</title>
<desc id="de">Depth, mask-boundary, pose-estimate, and coordinate-transform errors accumulate top to bottom to about ±6mm, which exceeds the ±5mm gripper clearance and fails. Compare the total against the clearance, not individual performance.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="340" rx="12"/>
<text class="t" x="18" y="22">Errors Add Up</text>
<rect class="bx" x="16" y="34" width="328" height="50" rx="9"/>
<text class="st" x="30" y="54">Depth error</text>
<text class="lb" x="30" y="72">∝ distance² · calibration bias</text>
<rect x="250" y="46" width="80" height="26" rx="5" fill="var(--blue)" opacity=".28"/>
<text class="lb" x="290" y="64" text-anchor="middle" style="fill:var(--blue)">± 2 mm</text>
<path class="ar" d="M180,84 L180,98"/>
<rect class="bx" x="16" y="100" width="328" height="50" rx="9"/>
<text class="st" x="30" y="120">Mask boundary error</text>
<text class="lb" x="30" y="138">Grabs a neighbor part or clips the edge</text>
<rect x="250" y="112" width="80" height="26" rx="5" fill="var(--teal)" opacity=".28"/>
<text class="lb" x="290" y="130" text-anchor="middle" style="fill:var(--teal)">± 1 mm</text>
<path class="ar" d="M180,150 L180,164"/>
<rect class="bx" x="16" y="166" width="328" height="50" rx="9"/>
<text class="st" x="30" y="186">Pose estimate error</text>
<text class="lb" x="30" y="204">Takes the two above as input, accumulates</text>
<rect x="250" y="178" width="80" height="26" rx="5" fill="var(--amber)" opacity=".28"/>
<text class="lb" x="290" y="196" text-anchor="middle" style="fill:var(--amber)">± 2 mm</text>
<path class="ar" d="M180,216 L180,230"/>
<rect class="bx" x="16" y="232" width="328" height="50" rx="9"/>
<text class="st" x="30" y="252">Coordinate transform · hand-eye error</text>
<text class="lb" x="30" y="270">Residual of camera → robot base transform</text>
<rect x="250" y="244" width="80" height="26" rx="5" fill="var(--mut)" opacity=".28"/>
<text class="lb" x="290" y="262" text-anchor="middle">± 1 mm</text>
<rect class="bxc" x="16" y="294" width="328" height="34" rx="9"/>
<text class="st" x="30" y="316">Total ≈ ± 6 mm</text>
<text class="lb" x="330" y="316" text-anchor="end" style="fill:var(--red)">Gripper clearance ± 5 mm → fail</text>
</svg>
