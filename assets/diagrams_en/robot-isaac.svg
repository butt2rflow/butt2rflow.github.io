<svg width="100%" viewBox="0 0 680 210" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The Isaac stack — our pipeline lives in the first two boxes</title>
<desc>Four layers of NVIDIA Isaac left to right: Isaac Sim trains the models, Isaac ROS runs them at the edge, Isaac Lab teaches new skills, and GR00T is the generalist-robot frontier. Our stereo-to-pose pipeline lives in the first two boxes.</desc>
<style>
:root { --tp:#3d3d3a; --ts:#73726c; --br:#d6d3c8; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.h{font-size:14px;font-weight:600;fill:var(--tp);}
.n{font-size:14px;font-weight:700;fill:#5b57e0;}
.r{font-size:11px;fill:var(--ts);}
.cap{font-size:11px;font-style:italic;fill:#0d9488;}
</style>
<rect x="0" y="0" width="680" height="210" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="34">The Isaac stack</text>

<!-- box 1 -->
<rect x="40" y="60" width="140" height="82" rx="10" fill="#ecebfd" stroke="#5b57e0" stroke-width="0.7"/>
<text class="n" x="110" y="96" text-anchor="middle">Isaac Sim</text>
<text class="r" x="110" y="118" text-anchor="middle">trains the models</text>
<text class="h" x="192" y="106" fill="var(--ts)">→</text>
<!-- box 2 -->
<rect x="210" y="60" width="140" height="82" rx="10" fill="#ecebfd" stroke="#5b57e0" stroke-width="0.7"/>
<text class="n" x="280" y="96" text-anchor="middle">Isaac ROS</text>
<text class="r" x="280" y="118" text-anchor="middle">runs them (edge)</text>
<text class="h" x="362" y="106" fill="var(--ts)">→</text>
<!-- box 3 -->
<rect x="380" y="60" width="140" height="82" rx="10" fill="#ecebfd" stroke="#5b57e0" stroke-width="0.7"/>
<text class="n" x="450" y="96" text-anchor="middle">Isaac Lab</text>
<text class="r" x="450" y="118" text-anchor="middle">teaches new skills</text>
<text class="h" x="532" y="106" fill="var(--ts)">→</text>
<!-- box 4 (frontier, filled) -->
<rect x="550" y="60" width="130" height="82" rx="10" fill="#5b57e0"/>
<text class="n" x="615" y="96" text-anchor="middle" style="fill:#ffffff">GR00T ★</text>
<text class="r" x="615" y="118" text-anchor="middle" style="fill:#e9e8ff">generalist frontier</text>

<!-- bracket over first two -->
<path d="M40,158 L40,150 L350,150 L350,158" fill="none" stroke="#0d9488" stroke-width="1.2"/>
<text class="cap" x="195" y="180" text-anchor="middle">our Stereo → SAM → Pose pipeline lives here</text>
</svg>
