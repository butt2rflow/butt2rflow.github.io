<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Same cup, two viewpoints, different numbers</title>
<desc>One cup in the middle. YOU stand at the lower-left, so the cup is ahead of you; the friend stands at the upper-right, so the same cup is behind them. Each has their own axes (a right direction and an ahead direction). To you the cup is "2 right, 3 ahead"; to your friend the same cup is "2 left, 3 behind". Left/right shows as side position, ahead/behind as up-down position. Same object, different numbers per viewpoint.</desc>
<style>
:root { --tp:#3d3d3a; --ts:#73726c; --br:#d6d3c8; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.h{font-size:14px;font-weight:600;fill:var(--tp);}
.s{font-size:12px;fill:var(--ts);}
.you{font-size:13px;font-weight:700;fill:#2f6fed;}
.fr{font-size:13px;font-weight:700;fill:#16a34a;}
.ax{font-size:10px;fill:var(--ts);}
</style>
<rect x="0" y="0" width="680" height="300" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="34">Same cup, two viewpoints, different numbers</text>

<!-- cup (center) -->
<ellipse cx="360" cy="150" rx="26" ry="20" fill="#0d9488" opacity="0.85"/>
<text class="s" x="360" y="184" text-anchor="middle">the cup</text>

<!-- sight lines -->
<line x1="164" y1="204" x2="336" y2="156" stroke="#2f6fed" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>
<line x1="526" y1="100" x2="384" y2="146" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>

<!-- YOU : lower-left, faces up → cup is ahead -->
<circle cx="150" cy="210" r="14" fill="#2f6fed"/>
<text class="you" x="128" y="215" text-anchor="end">YOU</text>
<line x1="168" y1="210" x2="204" y2="210" stroke="#2f6fed" stroke-width="1.6"/>
<path d="M198,206 L204,210 L198,214" fill="none" stroke="#2f6fed" stroke-width="1.6"/>
<text class="ax" x="210" y="214">right</text>
<line x1="150" y1="193" x2="150" y2="160" stroke="#2f6fed" stroke-width="1.6"/>
<path d="M146,166 L150,160 L154,166" fill="none" stroke="#2f6fed" stroke-width="1.6"/>
<text class="ax" x="150" y="152" text-anchor="middle">ahead</text>
<text class="s" x="150" y="240" text-anchor="middle">"2 right, 3 ahead"</text>

<!-- FRIEND : upper-right, faces up → cup is behind -->
<circle cx="540" cy="95" r="14" fill="#16a34a"/>
<text class="fr" x="518" y="99" text-anchor="end">FRIEND</text>
<line x1="558" y1="95" x2="594" y2="95" stroke="#16a34a" stroke-width="1.6"/>
<path d="M588,91 L594,95 L588,99" fill="none" stroke="#16a34a" stroke-width="1.6"/>
<text class="ax" x="600" y="99">right</text>
<line x1="540" y1="78" x2="540" y2="45" stroke="#16a34a" stroke-width="1.6"/>
<path d="M536,51 L540,45 L544,51" fill="none" stroke="#16a34a" stroke-width="1.6"/>
<text class="ax" x="540" y="37" text-anchor="middle">ahead</text>
<text class="s" x="540" y="128" text-anchor="middle">"2 left, 3 behind"</text>

<text class="s" x="340" y="282" text-anchor="middle">left/right = side position, ahead/behind = up-down — same object, different numbers</text>
</svg>
