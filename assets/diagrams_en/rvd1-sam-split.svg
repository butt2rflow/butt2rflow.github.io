<svg width="100%" viewBox="0 0 360 286" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">SAM's Encoder–Decoder Split</title>
<desc id="de">SAM splits the compute into two chunks. The heavy image encoder runs once per image to build a feature map; the light mask decoder reuses that feature map on every click to produce a mask instantly.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="286" rx="12"/>
<text class="t" x="18" y="22">Expensive Once, Cheap After</text>
<rect class="bx" x="16" y="34" width="328" height="62" rx="10"/>
<text class="lb" x="30" y="54" style="fill:var(--red)">Once per image · heavy</text>
<text class="st" x="30" y="73">Image encoder (ViT)</text>
<text class="st" x="30" y="88">Reads the whole image, compresses to a 'feature map'</text>
<path class="arb" d="M180,96 L180,114"/>
<rect class="bxc" x="80" y="116" width="200" height="34" rx="8"/>
<text class="st" x="180" y="138" text-anchor="middle">Feature map (reused)</text>
<path class="arb" d="M180,150 L180,168"/>
<rect class="bx" x="16" y="170" width="328" height="78" rx="10"/>
<text class="lb" x="30" y="190" style="fill:var(--teal)">Every click · light</text>
<text class="st" x="30" y="209">Mask decoder</text>
<text class="st" x="30" y="224">Feature map + prompt → mask</text>
<text class="st" x="30" y="240" style="fill:var(--teal)">Move the click, encoder does not rerun</text>
<text class="lb" x="180" y="272" text-anchor="middle">→ First click a moment, then instant</text>
</svg>
