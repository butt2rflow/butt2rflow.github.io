<svg width="100%" viewBox="0 0 360 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">Two-way attention structure</title>
<desc id="de">Prompt tokens and image features reference each other in both directions. This round trip is repeated twice to get the final mask.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="260" rx="12"/>
<text class="t" x="18" y="22">Tokens ↔ image, both ways</text>
<rect class="bxc" x="26" y="42" width="128" height="38" rx="8"/>
<text class="lb" x="90" y="66" text-anchor="middle">Output tokens + prompt</text>
<rect class="bxc" x="206" y="42" width="128" height="38" rx="8"/>
<text class="lb" x="270" y="66" text-anchor="middle">Image features</text>
<path class="arb" d="M154,56 L204,56"/>
<text class="lb" x="179" y="48" text-anchor="middle" style="fill:var(--blue)">→</text>
<path class="arb" d="M206,70 L156,70"/>
<rect class="bx" x="16" y="98" width="328" height="60" rx="10"/>
<text class="lb" x="30" y="118" style="fill:var(--blue)">① Tokens → image</text>
<text class="st" x="30" y="137">"What does the area around my point look like?"</text>
<text class="st" x="30" y="152">The prompt pulls information from the image</text>
<rect class="bx" x="16" y="166" width="328" height="60" rx="10"/>
<text class="lb" x="30" y="186" style="fill:var(--teal)">② Image → tokens</text>
<text class="st" x="30" y="205">"Do I belong to this object?"</text>
<text class="st" x="30" y="220">Each pixel references the tokens to decide membership</text>
<text class="lb" x="180" y="248" text-anchor="middle">Repeat this round trip 2× → final mask</text>
</svg>
