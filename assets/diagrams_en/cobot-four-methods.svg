<svg width="100%" viewBox="0 0 680 356" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The four collaborative methods the standard recognizes</title>
<desc>The four collaborative methods ISO/TS 15066 recognizes: safety-rated monitored stop (the robot stops when a person enters and resumes when they leave), hand guiding (the operator moves the robot by hand), speed and separation monitoring (it senses distance, slows as you near, and stops before contact), and power and force limiting (it caps its force so any contact stays below the injury limit — UR's default method).</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.h{font-size:15px;font-weight:700;}
.t{font-size:13px;font-weight:700;fill:#3d3d3a;}
.s{font-size:11px;fill:#73726c;}
.n{font-size:11px;font-weight:700;}
.badge{font-size:10.5px;font-weight:700;}
</style>
<rect x="0" y="0" width="680" height="356" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="40" style="fill:#3d3d3a">The four collaborative methods the standard recognizes</text>

<rect x="40" y="60" width="290" height="126" rx="10" fill="#fff" stroke="#d6d3c8" stroke-width="1"/>
<text class="n" x="60" y="86" style="fill:#8a8781">1</text>
<text class="t" x="80" y="88">Safety-rated monitored stop (SRMS)</text>
<text class="s" x="60" y="118">The robot stops (power kept on) when</text>
<text class="s" x="60" y="136">a person enters the shared zone,</text>
<text class="s" x="60" y="154">and resumes when they leave.</text>

<rect x="350" y="60" width="290" height="126" rx="10" fill="#fff" stroke="#d6d3c8" stroke-width="1"/>
<text class="n" x="370" y="86" style="fill:#8a8781">2</text>
<text class="t" x="390" y="88">Hand guiding (HG)</text>
<text class="s" x="370" y="118">The operator moves the robot by</text>
<text class="s" x="370" y="136">hand; it goes only where the</text>
<text class="s" x="370" y="154">person guides it.</text>

<rect x="40" y="200" width="290" height="126" rx="10" fill="#fff" stroke="#d6d3c8" stroke-width="1"/>
<text class="n" x="60" y="226" style="fill:#8a8781">3</text>
<text class="t" x="80" y="228">Speed &amp; separation monitoring (SSM)</text>
<text class="s" x="60" y="258">Senses distance: slows as you near,</text>
<text class="s" x="60" y="276">stops before contact, and speeds</text>
<text class="s" x="60" y="294">up again as you move away.</text>

<rect x="350" y="200" width="290" height="126" rx="10" fill="#e3f6ea" stroke="#16a34a" stroke-width="1.6"/>
<text class="n" x="370" y="226" style="fill:#15803d">4</text>
<text class="t" x="390" y="228" style="fill:#15803d">Power &amp; force limiting (PFL)</text>
<rect x="560" y="212" width="62" height="20" rx="10" fill="#16a34a"/>
<text class="badge" x="591" y="226" text-anchor="middle" style="fill:#ffffff">UR default</text>
<text class="s" x="370" y="258">The robot caps its force so any</text>
<text class="s" x="370" y="276">contact stays below the injury limit.</text>
<text class="s" x="370" y="294">Contact is allowed — it just doesn't hurt.</text>
</svg>
