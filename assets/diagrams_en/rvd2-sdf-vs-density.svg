<svg width="100%" viewBox="0 0 360 252" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">Density vs SDF representation</title>
<desc id="de">NeRF's density representation leaves surface boundaries fuzzy, while SDF defines the surface sharply. Pose estimation needs surface location to the millimeter, so it uses SDF.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="252" rx="12"/>
<text class="t" x="18" y="22">Why SDF, not NeRF</text>
<rect class="bx" x="16" y="36" width="156" height="128" rx="10"/>
<text class="lb" x="94" y="56" text-anchor="middle">Density-based (NeRF)</text>
<path d="M36,110 C56,86 76,130 96,100 C116,74 136,118 152,96" fill="none" stroke="var(--red)" stroke-width="2"/>
<text class="lb" x="94" y="134" text-anchor="middle">Surface is 'fuzzy'</text>
<text class="lb" x="94" y="152" text-anchor="middle" style="fill:var(--red)">Boundary unclear</text>
<rect class="bx" x="188" y="36" width="156" height="128" rx="10"/>
<text class="lb" x="266" y="56" text-anchor="middle" style="fill:var(--teal)">Signed distance (SDF)</text>
<path d="M208,100 L324,100" stroke="var(--teal)" stroke-width="2.4"/>
<text class="lb" x="266" y="90" text-anchor="middle">+ outside</text>
<text class="lb" x="266" y="118" text-anchor="middle">− inside</text>
<text class="lb" x="266" y="140" text-anchor="middle">0 = surface</text>
<text class="lb" x="266" y="158" text-anchor="middle" style="fill:var(--teal)">Surface sharply defined</text>
<rect class="bxc" x="16" y="176" width="328" height="64" rx="9"/>
<text class="st" x="30" y="196">Pose estimation must pin <tspan style="font-weight:700">surface location</tspan> to the millimeter.</text>
<text class="st" x="30" y="214">"There's some matter here" is not enough;</text>
<text class="st" x="30" y="232">"the surface is exactly here" is needed. → SDF</text>
</svg>
