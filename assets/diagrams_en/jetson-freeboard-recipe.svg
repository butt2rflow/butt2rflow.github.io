<svg width="100%" viewBox="0 0 680 206" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The free-the-board recipe — three steps to bake the engine</title>
<desc>Step 1, free the board (stop idle containers and drop the page cache, free memory 663 MB to 14 GB), is the key. Step 2, give the scratch workspace a cap (memPoolSize workspace 10240). Step 3, raise the builder optimization level to 5. The result is an engine build that PASSES.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.h{font-size:15px;font-weight:700;fill:#3d3d3a;}
.m{font-size:11.5px;font-weight:700;fill:#3f4d66;}
.s{font-size:9.5px;fill:#73726c;}
.code{font-size:9px;font-family:"SFMono-Regular",Consolas,monospace;fill:#3f4d66;}
.tag{font-size:9.5px;font-weight:700;fill:#15803d;}
.res{font-size:11px;font-weight:700;fill:#15803d;}
</style>
<rect x="0" y="0" width="680" height="206" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="34">The free-the-board recipe — three steps to bake the engine</text>

<!-- step 1 (key, green) -->
<text class="tag" x="114" y="62" text-anchor="middle">★ the key (90%)</text>
<rect x="40" y="68" width="148" height="98" rx="9" fill="#fff" stroke="#16a34a" stroke-width="1.8"/>
<text class="m" x="52" y="90">① Free the board</text>
<text class="code" x="52" y="110">docker stop 〈idle〉</text>
<text class="code" x="52" y="126">echo 3 &gt; drop_caches</text>
<text class="s" x="52" y="148">free 663MB → 14GB</text>
<text class="s" x="52" y="162">contig 12MB → 1.2GB</text>

<!-- arrow -->
<path d="M192 117 L209 117" stroke="#9a988f" stroke-width="1.4" marker-end="url(#a)"/>

<!-- step 2 -->
<rect x="213" y="68" width="148" height="98" rx="9" fill="#fff" stroke="#5b6b86" stroke-width="1.1"/>
<text class="m" x="225" y="90">② Cap the scratch</text>
<text class="code" x="225" y="112">trtexec ... \</text>
<text class="code" x="225" y="128">--memPoolSize=</text>
<text class="code" x="225" y="142">  workspace:10240</text>
<text class="s" x="225" y="160">none set before</text>

<!-- arrow -->
<path d="M365 117 L382 117" stroke="#9a988f" stroke-width="1.4" marker-end="url(#a)"/>

<!-- step 3 -->
<rect x="386" y="68" width="148" height="98" rx="9" fill="#fff" stroke="#5b6b86" stroke-width="1.1"/>
<text class="m" x="398" y="90">③ Raise opt level</text>
<text class="code" x="398" y="112">--builderOptimiz-</text>
<text class="code" x="398" y="126">  ationLevel=5</text>
<text class="s" x="398" y="148">tries more tactics</text>
<text class="s" x="398" y="162">attacks "none found"</text>

<!-- arrow -->
<path d="M538 117 L555 117" stroke="#9a988f" stroke-width="1.4" marker-end="url(#a)"/>

<!-- result -->
<rect x="559" y="92" width="82" height="50" rx="9" fill="#e3f6ea" stroke="#16a34a" stroke-width="1.3"/>
<text class="s" x="600" y="112" text-anchor="middle" style="fill:#15803d">engine build</text>
<text class="res" x="600" y="130" text-anchor="middle">&amp;&amp;&amp;&amp; PASSED</text>

<defs><marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#9a988f"/></marker></defs>
</svg>
