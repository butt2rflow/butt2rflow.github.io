<svg width="100%" viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sliding shifts the origin; spinning turns the viewpoint</title>
<desc>Left panel: two rulers with origins three apart; a dot reads 5 on the top ruler and 2 on the bottom, so A equals B plus 3 — that is translation, a shift of origin. Right panel: two viewpoints share an origin, one facing up and one facing right, ninety degrees apart — that is rotation, a turn of viewpoint.</desc>
<style>
:root { --tp:#3d3d3a; --ts:#73726c; --br:#d6d3c8; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.h{font-size:13px;font-weight:600;fill:var(--tp);}
.s{font-size:12px;fill:var(--ts);}
.tag{font-size:12px;font-weight:700;}
</style>
<rect x="0" y="0" width="680" height="250" rx="12" fill="#FAF8F2"/>

<!-- LEFT: sliding -->
<text class="tag" x="40" y="36" fill="#0d9488">Sliding = translation</text>
<rect x="40" y="52" width="280" height="150" rx="10" fill="#fff" stroke="var(--br)" stroke-width="1"/>
<!-- ruler A -->
<line x1="70" y1="110" x2="290" y2="110" stroke="#2f6fed" stroke-width="1.5"/>
<text class="s" x="70" y="102" fill="#2f6fed">A: 0</text>
<text class="s" x="230" y="102" fill="#2f6fed">A: 5</text>
<!-- ruler B (offset right by ~gap) -->
<line x1="118" y1="150" x2="290" y2="150" stroke="#16a34a" stroke-width="1.5"/>
<text class="s" x="118" y="170" fill="#16a34a">B: 0</text>
<text class="s" x="230" y="170" fill="#16a34a">B: 2</text>
<!-- dot -->
<circle cx="230" cy="130" r="7" fill="#0d9488"/>
<line x1="230" y1="110" x2="230" y2="150" stroke="#0d9488" stroke-width="1" stroke-dasharray="3 3"/>
<text class="s" x="180" y="196" text-anchor="middle">gap = 3 · A = B + 3</text>

<!-- RIGHT: spinning -->
<text class="tag" x="360" y="36" fill="#9333ea">Spinning = rotation</text>
<rect x="360" y="52" width="280" height="150" rx="10" fill="#fff" stroke="var(--br)" stroke-width="1"/>
<!-- shared origin -->
<circle cx="470" cy="150" r="4" fill="#3d3d3a"/>
<line x1="470" y1="150" x2="470" y2="80" stroke="#2f6fed" stroke-width="2"/>
<text class="s" x="470" y="74" text-anchor="middle" fill="#2f6fed">Alice ↑</text>
<line x1="470" y1="150" x2="560" y2="150" stroke="#16a34a" stroke-width="2"/>
<text class="s" x="580" y="154" fill="#16a34a">Bob →</text>
<path d="M470,110 A40,40 0 0,1 510,150" fill="none" stroke="#9333ea" stroke-width="2"/>
<text class="s" x="516" y="116" fill="#9333ea">90°</text>
<ellipse cx="524" cy="92" rx="18" ry="13" fill="#0d9488" opacity="0.8"/>
<text class="s" x="524" y="70" text-anchor="middle">same cup</text>
</svg>
