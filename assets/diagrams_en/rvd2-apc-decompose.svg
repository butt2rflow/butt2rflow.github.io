<svg width="100%" viewBox="0 0 360 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">3D convolution decomposition</title>
<desc id="de">Split the expensive monolithic 3D convolution into a spatial direction and a disparity direction. Spend the saved budget on a bigger kernel to see wider context.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="232" rx="12"/>
<text class="t" x="18" y="22">All at once → split into two</text>
<rect class="bx" x="16" y="36" width="150" height="140" rx="10"/>
<text class="lb" x="91" y="56" text-anchor="middle" style="fill:var(--red)">Monolithic 3D</text>
<g opacity=".75">
<rect x="46" y="72" width="90" height="72" rx="4" fill="var(--red)" opacity=".35"/>
<rect x="54" y="80" width="90" height="72" rx="4" fill="var(--red)" opacity=".35"/>
<rect x="62" y="88" width="90" height="72" rx="4" fill="var(--red)" opacity=".35"/>
</g>
<text class="lb" x="91" y="170" text-anchor="middle">Costly · kernel can't grow</text>
<rect class="bx" x="194" y="36" width="150" height="140" rx="10"/>
<text class="lb" x="269" y="56" text-anchor="middle" style="fill:var(--teal)">Axis-wise split</text>
<rect x="212" y="72" width="114" height="34" rx="4" fill="var(--teal)" opacity=".4"/>
<text class="lb" x="269" y="94" text-anchor="middle">Spatial (H, W)</text>
<text class="lb" x="269" y="120" text-anchor="middle">+</text>
<rect x="246" y="128" width="46" height="32" rx="4" fill="var(--blue)" opacity=".4"/>
<text class="lb" x="269" y="149" text-anchor="middle">Disparity (D)</text>
<text class="lb" x="269" y="170" text-anchor="middle" style="fill:var(--teal)">Cheap · big kernel</text>
<text class="lb" x="180" y="202" text-anchor="middle">Spend the saved budget to see <tspan style="fill:var(--teal)">wider context</tspan></text>
<text class="lb" x="180" y="222" text-anchor="middle">= fill textureless regions with surrounding info</text>
</svg>
