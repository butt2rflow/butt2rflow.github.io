<svg width="100%" viewBox="0 0 360 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">Domain randomization — learn broadly to contain reality</title>
<desc id="de">Rendering the same scene many times with randomized lighting, background, color and angle makes the learned distribution wide enough to contain the real world as a single point.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:12px;font-weight:700}
.st{font-size:10px;fill:var(--mut)}
.dist{fill:var(--chip);stroke:var(--teal);stroke-width:1.3}
.ar{stroke:var(--mut);stroke-width:1.8;fill:none;marker-end:url(#ah)}
.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="236" rx="12"/>
<text class="t" x="18" y="22">Same scene every time different — reality is one of them</text>
<text class="st" x="20" y="46">same scene, randomized</text>
<rect x="20" y="54" width="34" height="28" rx="4" style="fill:var(--blue);opacity:.55"/>
<rect x="60" y="54" width="34" height="28" rx="4" style="fill:var(--amber);opacity:.55"/>
<rect x="100" y="54" width="34" height="28" rx="4" style="fill:var(--teal);opacity:.55"/>
<rect x="20" y="88" width="34" height="28" rx="4" style="fill:var(--red);opacity:.5"/>
<rect x="60" y="88" width="34" height="28" rx="4" style="fill:var(--teal);opacity:.4"/>
<rect x="100" y="88" width="34" height="28" rx="4" style="fill:var(--blue);opacity:.4"/>
<rect x="20" y="122" width="34" height="28" rx="4" style="fill:var(--amber);opacity:.4"/>
<rect x="60" y="122" width="34" height="28" rx="4" style="fill:var(--blue);opacity:.6"/>
<rect x="100" y="122" width="34" height="28" rx="4" style="fill:var(--red);opacity:.4"/>
<text class="st" x="20" y="168">lighting · background · color</text>
<text class="st" x="20" y="182">· texture · angle · physics</text>
<line class="ar" x1="146" y1="100" x2="196" y2="100"/>
<ellipse class="dist" cx="272" cy="104" rx="76" ry="60"/>
<text class="st" x="272" y="58" text-anchor="middle" style="fill:var(--teal)">the learned distribution</text>
<circle cx="245" cy="95" r="3" class="mk"/><circle cx="290" cy="82" r="3" class="mk"/>
<circle cx="258" cy="120" r="3" class="mk"/><circle cx="300" cy="118" r="3" class="mk"/>
<circle cx="228" cy="112" r="3" class="mk"/><circle cx="312" cy="98" r="3" class="mk"/>
<circle cx="275" cy="104" r="5" style="fill:var(--blue)"/>
<text class="st" x="272" y="150" text-anchor="middle" style="fill:var(--blue)">● real = one point inside</text>
<text class="st" x="180" y="224" text-anchor="middle" style="fill:var(--mut)">Don't imitate reality — learn broadly enough to contain it</text>
</svg>
