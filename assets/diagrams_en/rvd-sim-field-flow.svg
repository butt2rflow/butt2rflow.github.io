<svg width="100%" viewBox="0 0 360 168" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">The field flow — simulation is a starting point</title>
<desc id="de">Learn at scale in simulation, then fine-tune or validate on a little real data, then close the remaining gap with calibration before deploying.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:12.5px;font-weight:700}
.st{font-size:9.5px;fill:var(--mut)}
.num{font-size:11px;font-weight:700}
.box{fill:var(--bg);stroke:var(--bd);stroke-width:1.3}
.ar{stroke:var(--blue);stroke-width:1.8;fill:none;marker-end:url(#ah)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="168" rx="12"/>
<text class="t" x="18" y="24">Sim learning → real validation → calibration → deploy</text>
<rect class="box" x="14" y="42" width="98" height="72" rx="10"/>
<text class="num" x="26" y="62" style="fill:var(--teal)">1. Sim learn</text>
<text class="st" x="26" y="82">at scale, broadly</text>
<text class="st" x="26" y="96">(randomization)</text>
<line class="ar" x1="114" y1="78" x2="128" y2="78"/>
<rect class="box" x="131" y="42" width="98" height="72" rx="10"/>
<text class="num" x="143" y="62" style="fill:var(--amber)">2. Real check</text>
<text class="st" x="143" y="82">a little fine-tune</text>
<text class="st" x="143" y="96">or at least verify</text>
<line class="ar" x1="231" y1="78" x2="245" y2="78"/>
<rect class="box" x="248" y="42" width="98" height="72" rx="10"/>
<text class="num" x="260" y="62" style="fill:var(--blue)">3. Calibrate</text>
<text class="st" x="260" y="82">camera calib +</text>
<text class="st" x="260" y="96">frame alignment</text>
<text class="st" x="180" y="140" text-anchor="middle" style="fill:var(--mut)">Simulation is a starting point, not a destination — you live the gap to close it</text>
</svg>
