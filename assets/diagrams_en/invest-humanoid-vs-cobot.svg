<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Humanoid vs cobot — the narrative is up, the money is right</title>
<desc>The x-axis is deployment reality (how widely it's actually installed today), the y-axis is generality (how many things it can do). Humanoids sit top-left: high generality but barely deployed — where the narrative and valuation crowd. Cobots and industrial arms sit bottom-right: specialized but already widely deployed — where the revenue and cash are. Technology drifts slowly from cobot toward humanoid.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.h{font-size:15px;font-weight:700;}
.b{font-size:13px;font-weight:600;}
.s{font-size:11px;fill:#73726c;}
.ax{font-size:12px;font-weight:600;fill:#73726c;}
</style>
<rect x="0" y="0" width="680" height="430" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="38" style="fill:#3d3d3a">Narrative is up (humanoids), money is right (cobots)</text>

<line x1="110" y1="360" x2="635" y2="360" stroke="#c9c6bc" stroke-width="1.5"/>
<line x1="110" y1="360" x2="110" y2="72" stroke="#c9c6bc" stroke-width="1.5"/>
<text class="ax" x="372" y="392" text-anchor="middle">Deployment reality — how widely installed today →</text>
<text class="ax" x="70" y="216" text-anchor="middle" transform="rotate(-90 70 216)">Generality — how many things it can do ↑</text>

<line x1="545" y1="300" x2="220" y2="140" stroke="#a9a69c" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M229,133 L218,139 L226,148" fill="none" stroke="#a9a69c" stroke-width="1.6"/>
<text class="s" x="392" y="208" text-anchor="middle" transform="rotate(-26 392 208)">direction of tech (slowly)</text>

<circle cx="205" cy="122" r="11" style="fill:#d84a3a"/>
<text class="b" x="224" y="119" style="fill:#d84a3a">Humanoids</text>
<text class="s" x="224" y="135">prototype·pilot · mostly private</text>
<rect x="162" y="150" width="200" height="26" rx="13" fill="#f7dcd6" stroke="#d84a3a" stroke-width="0.8"/>
<text class="s" x="262" y="167" text-anchor="middle" style="fill:#b23a2c">← narrative &amp; valuation here</text>

<circle cx="368" cy="252" r="9" style="fill:#8a8781"/>
<text class="b" x="384" y="250" style="fill:#3d3d3a">Mobile robots (AMR)</text>
<text class="s" x="384" y="265">warehouse automation</text>

<circle cx="518" cy="320" r="8" style="fill:#3d7a4a"/>
<circle cx="558" cy="302" r="12" style="fill:#16a34a"/>
<text class="b" x="500" y="300" text-anchor="end" style="fill:#16a34a">Cobots · industrial arms</text>
<text class="s" x="500" y="316" text-anchor="end">specialized · tens of thousands</text>
<rect x="466" y="334" width="172" height="26" rx="13" fill="#e3f6ea" stroke="#16a34a" stroke-width="0.8"/>
<text class="s" x="552" y="351" text-anchor="middle" style="fill:#15803d">revenue &amp; cash here →</text>
</svg>
