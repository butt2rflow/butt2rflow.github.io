<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Open vs closed — can the AI reach into the robot's force loop?</title>
<desc>Left, UR: the edge AI and the robot talk over RTDE at 500Hz (2ms) in both directions, so the AI reads force/torque and commands force directly via force_mode. Right, FANUC: externally only position commands flow (tens of Hz on the free path; the paid high-rate streaming option is still position-only), and the force-control loop is walled off inside the robot where the AI cannot reach it.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.h{font-size:15px;font-weight:700;}
.b{font-size:13px;font-weight:600;fill:#3d3d3a;}
.s{font-size:11px;fill:#73726c;}
.big{font-size:13px;font-weight:700;}
</style>
<rect x="0" y="0" width="680" height="320" rx="12" fill="#FAF8F2"/>

<rect x="40" y="52" width="280" height="240" rx="10" fill="#fff" stroke="#d6d3c8" stroke-width="1"/>
<text class="h" x="180" y="80" text-anchor="middle" style="fill:#16a34a">UR — open</text>
<rect x="86" y="98" width="188" height="40" rx="8" fill="#e3f6ea" stroke="#16a34a" stroke-width="0.8"/>
<text class="b" x="180" y="123" text-anchor="middle">AI · edge computer</text>
<rect x="86" y="212" width="188" height="46" rx="8" fill="#eef1f6" stroke="#9aa0a8" stroke-width="0.8"/>
<text class="b" x="180" y="233" text-anchor="middle">Robot (force loop)</text>
<text class="s" x="180" y="250" text-anchor="middle">force/torque sensor</text>
<g stroke="#16a34a" stroke-width="2.4">
<line x1="150" y1="140" x2="150" y2="210"/><path d="M146,146 L150,140 L154,146" fill="none"/>
<line x1="210" y1="210" x2="210" y2="142"/><path d="M206,148 L210,142 L214,148" fill="none"/>
</g>
<text class="big" x="180" y="180" text-anchor="middle" style="fill:#16a34a">RTDE</text>
<text class="s" x="180" y="196" text-anchor="middle" style="fill:#16a34a">500Hz · 2ms</text>
<text class="s" x="86" y="180" style="fill:#16a34a">read F/T ↑</text>
<text class="s" x="216" y="180" style="fill:#16a34a">force_mode ↓</text>
<text class="s" x="180" y="278" text-anchor="middle">→ AI controls force live</text>

<rect x="360" y="52" width="280" height="240" rx="10" fill="#fff" stroke="#d6d3c8" stroke-width="1"/>
<text class="h" x="500" y="80" text-anchor="middle" style="fill:#d84a3a">FANUC — closed</text>
<rect x="406" y="98" width="188" height="40" rx="8" fill="#f6efe9" stroke="#c99a6a" stroke-width="0.8"/>
<text class="b" x="500" y="123" text-anchor="middle">AI · edge computer</text>
<rect x="406" y="196" width="188" height="62" rx="8" fill="#eef1f6" stroke="#9aa0a8" stroke-width="0.8"/>
<rect x="436" y="210" width="128" height="34" rx="6" fill="#f7dcd6" stroke="#d84a3a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text class="s" x="500" y="231" text-anchor="middle" style="fill:#d84a3a">force control (walled off)</text>
<line x1="500" y1="140" x2="500" y2="194" stroke="#c99a6a" stroke-width="2"/>
<path d="M496,188 L500,194 L504,188" fill="none" stroke="#c99a6a" stroke-width="2"/>
<text class="s" x="512" y="162" style="fill:#8a6d3b">position only</text>
<text class="s" x="512" y="177" style="fill:#8a6d3b">no force</text>
<text class="big" x="500" y="285" text-anchor="middle" style="fill:#d84a3a">force is out of AI's reach</text>
</svg>
