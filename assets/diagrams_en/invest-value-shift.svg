<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Physical AI value-shift map — what it lifts vs what it presses</title>
<desc>Physical AI lifts value on one side (compute — NVIDIA; robot joints/reducers — Harmonic Drive and Nabtesco; open force control — UR) and presses it on the other (the robot-guidance premium of traditional 3D machine vision — Cognex and Keyence, undercut by cheap stereo cameras plus foundation models). But the pressured side has a determinism barrier: inspection and metrology hold, and value settles in the fusion of AI with deterministic verification.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.h{font-size:14px;font-weight:700;}
.b{font-size:12.5px;font-weight:600;fill:#3d3d3a;}
.s{font-size:11px;fill:#73726c;}
.zt{font-size:13px;font-weight:700;}
</style>
<rect x="0" y="0" width="680" height="400" rx="12" fill="#FAF8F2"/>

<rect x="270" y="182" width="140" height="40" rx="10" fill="#fff" stroke="#c9a24a" stroke-width="1.4"/>
<text class="h" x="340" y="207" text-anchor="middle" style="fill:#a9791f">Physical AI</text>

<line x1="340" y1="182" x2="340" y2="140" stroke="#16a34a" stroke-width="2.4"/>
<path d="M334,148 L340,140 L346,148" fill="none" stroke="#16a34a" stroke-width="2.4"/>
<line x1="340" y1="222" x2="340" y2="262" stroke="#d84a3a" stroke-width="2.4"/>
<path d="M334,254 L340,262 L346,254" fill="none" stroke="#d84a3a" stroke-width="2.4"/>

<text class="zt" x="40" y="52" style="fill:#16a34a">What it lifts — winners</text>
<rect x="40" y="64" width="180" height="58" rx="9" fill="#e3f6ea" stroke="#16a34a" stroke-width="0.9"/>
<text class="b" x="130" y="88" text-anchor="middle">Compute · the brain</text>
<text class="s" x="130" y="106" text-anchor="middle">NVIDIA</text>
<rect x="250" y="64" width="180" height="58" rx="9" fill="#e3f6ea" stroke="#16a34a" stroke-width="0.9"/>
<text class="b" x="340" y="88" text-anchor="middle">Robot joints · reducers</text>
<text class="s" x="340" y="106" text-anchor="middle">Harmonic Drive · Nabtesco</text>
<rect x="460" y="64" width="180" height="58" rx="9" fill="#e3f6ea" stroke="#16a34a" stroke-width="0.9"/>
<text class="b" x="550" y="88" text-anchor="middle">Open force control</text>
<text class="s" x="550" y="106" text-anchor="middle">UR (Teradyne)</text>

<text class="zt" x="40" y="292" style="fill:#d84a3a">What it presses — pressured</text>
<rect x="40" y="304" width="330" height="56" rx="9" fill="#f7dcd6" stroke="#d84a3a" stroke-width="0.9"/>
<text class="b" x="205" y="327" text-anchor="middle">Traditional 3D machine-vision robot guidance</text>
<text class="s" x="205" y="345" text-anchor="middle">Cognex · Keyence ← cheap stereo + foundation models</text>

<rect x="392" y="304" width="248" height="56" rx="9" fill="#eef1f6" stroke="#5b6b86" stroke-width="1.1" stroke-dasharray="5 3"/>
<text class="b" x="516" y="325" text-anchor="middle" style="fill:#3f4d66">Determinism barrier</text>
<text class="s" x="516" y="343" text-anchor="middle">inspection·metrology hold · AI+deterministic fusion</text>
</svg>
