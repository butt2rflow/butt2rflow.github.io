<svg width="100%" viewBox="0 0 360 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">The order to read a paper</title>
<desc id="de">Read in this order: structure figure → ablation table → zero-shot performance table → failure cases. The ablation especially answers 'what you should care about'.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="262" rx="12"/>
<text class="t" x="18" y="22">Read in this order and 30 minutes is enough</text>
<rect class="bx" x="16" y="34" width="328" height="44" rx="9"/>
<text class="lb" x="30" y="53">1 · Structure figure (near Figure 2)</text>
<text class="st" x="30" y="70">Just block names and arrows. Compare with this post's diagram.</text>
<path class="ar" d="M180,78 L180,92"/>
<rect class="bx" x="16" y="94" width="328" height="44" rx="9"/>
<text class="lb" x="30" y="113">2 · Ablation table</text>
<text class="st" x="30" y="130">Drop per block; the performance drop = importance ranking</text>
<path class="ar" d="M180,138 L180,152"/>
<rect class="bx" x="16" y="154" width="328" height="44" rx="9"/>
<text class="lb" x="30" y="173">3 · Zero-shot performance table</text>
<text class="st" x="30" y="190">Only numbers on unseen datasets — closest to field expectation</text>
<path class="ar" d="M180,198 L180,212"/>
<rect class="bx" x="16" y="214" width="328" height="44" rx="9"/>
<text class="lb" x="30" y="233">4 · Failure cases (Limitations)</text>
<text class="st" x="30" y="250">Usually short at the very end. For field use, this matters most.</text>
</svg>
