<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The credit triangle — spread, default probability, and loss severity</title>
<desc>Spread is roughly default probability times loss severity (one minus recovery). Know two of the three and the third is solved. Observe a 260bp spread and assume 40 percent recovery, and the implied default rate comes out near 4.3 percent.</desc>
<style>
:root { --tp:#3d3d3a; --ts:#73726c; --br:#d6d3c8; }
text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.th { font-size:14px; font-weight:500; fill:var(--tp); }
.s { font-size:12px; font-weight:400; fill:var(--ts); }
.nb { font-size:14px; font-weight:500; }
.ns { font-size:12px; font-weight:400; }
</style>
<rect x="0" y="0" width="680" height="440" rx="12" fill="#FAF8F2"/>

<path d="M340,96 L150,300 L530,300 Z" fill="none" stroke="#c9b89a" stroke-width="1.2" stroke-dasharray="4 4"/>

<text class="th" x="340" y="228" text-anchor="middle">Spread ≈ default prob × loss severity</text>
<text class="s" x="340" y="248" text-anchor="middle">know two, solve the third</text>

<rect x="252" y="60" width="176" height="52" rx="9" fill="#CDE7DC" stroke="#1D9E75" stroke-width="0.8"/>
<text class="nb" x="340" y="82" text-anchor="middle" fill="#0F3D30">Spread</text>
<text class="ns" x="340" y="100" text-anchor="middle" fill="#1D9E75">observed · 260bp</text>

<rect x="62" y="300" width="176" height="52" rx="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="nb" x="150" y="322" text-anchor="middle" fill="#2C2C2A">Default prob (PD)</text>
<text class="ns" x="150" y="340" text-anchor="middle" fill="#5F5E5A">what we solve for</text>

<rect x="442" y="300" width="176" height="52" rx="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="nb" x="530" y="322" text-anchor="middle" fill="#2C2C2A">Loss severity (LGD)</text>
<text class="ns" x="530" y="340" text-anchor="middle" fill="#5F5E5A">= 1 − recovery (~60%)</text>

<line x1="90" y1="386" x2="590" y2="386" stroke="var(--br)" stroke-width="0.5"/>
<text class="th" x="340" y="410" text-anchor="middle">Invert:  implied default = spread ÷ (1 − recovery)</text>
<text class="s" x="340" y="430" text-anchor="middle">= 2.6% ÷ 0.60 ≈ 4.3%</text>
</svg>
