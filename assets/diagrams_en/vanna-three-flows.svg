<svg width="100%" viewBox="0 0 680 236" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Three things that move delta — price, volatility, time</title>
<desc>Three greeks keep moving a dealer's delta: gamma when spot price moves (the price pedal), vanna when volatility moves (the fear pedal), and charm as time passes (the hourglass pedal).</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.h{font-size:15px;font-weight:700;}
.nm{font-size:15px;font-weight:800;}
.d{font-size:12px;fill:#73726c;}
.tr{font-size:12.5px;font-weight:600;fill:#3d3d3a;}
.pd{font-size:11.5px;fill:#8a6d3b;}
</style>
<rect x="0" y="0" width="680" height="236" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="38" style="fill:#3d3d3a">Three things that move delta — price, volatility, time</text>

<rect x="40" y="60" width="185" height="140" rx="10" fill="#fff" stroke="#2f6fed" stroke-width="1.3"/>
<text class="nm" x="60" y="92" style="fill:#2f6fed">Gamma</text>
<text class="d" x="60" y="112">∂delta / ∂spot</text>
<text class="tr" x="60" y="142">spot price moves</text>
<text class="pd" x="60" y="176">"price pedal"</text>

<rect x="247" y="60" width="185" height="140" rx="10" fill="#fff" stroke="#e0870b" stroke-width="1.3"/>
<text class="nm" x="267" y="92" style="fill:#b5700a">Vanna</text>
<text class="d" x="267" y="112">∂delta / ∂vol</text>
<text class="tr" x="267" y="142">volatility moves</text>
<text class="pd" x="267" y="176">"fear pedal"</text>

<rect x="454" y="60" width="186" height="140" rx="10" fill="#fff" stroke="#5b6b86" stroke-width="1.3"/>
<text class="nm" x="474" y="92" style="fill:#3f4d66">Charm</text>
<text class="d" x="474" y="112">∂delta / ∂time</text>
<text class="tr" x="474" y="142">time passes</text>
<text class="pd" x="474" y="176">"hourglass pedal"</text>
</svg>
