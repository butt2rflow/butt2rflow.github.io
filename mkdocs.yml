site_name: butterflow 투자 노트
site_url: https://butt2rflow.github.io
site_description: 변동성을 적이 아닌 연료로 — 수학과 데이터에 기반한 투자 원칙
site_author: butterflow

theme:
  name: material
  language: ko
  palette:
    scheme: default
    primary: amber
    accent: deep orange
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.tabs.link
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  logo: assets/butterflow.png
  favicon: assets/butterflow.png

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: ko
          name: "🇰🇷 한국어"
          build: true
          default: true
          site_name: "butterflow 투자 노트"
          nav_translations:
            Home: 홈
            Series: 시리즈
            Posts: 글
            "Options Analysis": 옵션 분석
            "Market Data": 시장 데이터
            Tools: 도구
            Principles: 원칙편 (무료 1편)
            "Execution (preview)": 실행편 (미리보기)
            "Extension (preview)": 확장편 (미리보기)
            "Depth (preview)": 심화편 (미리보기)
        - locale: en
          name: "🇺🇸 English"
          build: true
          site_name: "butterflow Investment Notes"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/butt2rflow
  analytics:
    provider: google
    property: G-XXXXXXXXXX

extra_css:
  - assets/custom.css

extra_javascript:
  - assets/sidebar-widget.js
  - assets/vix-history-player.js

nav:
  - Home: index.md
  - "Returns 101":
    - posts/log-return.md
    - posts/portfolio-return.md
    - posts/expected-return.md
    - posts/derivatives-leverage-cost.md
  - "Market Data":
    - posts/cot.md
    - posts/fedwatch.md
  - "Options 101":
    - posts/options-basics.md
    - posts/skew.md
    - posts/hedging-wings.md
    - posts/implied-correlation.md
  - Tools:
    - posts/monte-carlo.md
    - posts/almanac.md
    - posts/gex-calculator.md
    - posts/gex-0dte-patterns.md
    - posts/volatility-dashboard.md
    - posts/vix-term-structure.md
  - Series:
    - series/index.md
    - Principles:
      - series/s1-shannons-demon.md
    - "Execution (preview)": series/s2-preview.md
    - "Extension (preview)": series/s3-preview.md
    - "Depth (preview)": series/s4-preview.md

copyright: "&copy; 2020-2026 butterflow. All rights reserved. | Butter curl image by <a href='https://www.vecteezy.com'>Vecteezy</a>"
