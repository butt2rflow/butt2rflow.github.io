<line x1="70" y1="280.0" x2="650" y2="280.0" style="stroke:var(--bd);stroke-width:1"/>
<text class="sm" x="62" y="284.0" text-anchor="end">2 GB</text>
<line x1="70" y1="240.0" x2="650" y2="240.0" style="stroke:var(--bd);stroke-width:1"/>
<text class="sm" x="62" y="244.0" text-anchor="end">3 GB</text>
<line x1="70" y1="200.0" x2="650" y2="200.0" style="stroke:var(--bd);stroke-width:1"/>
<text class="sm" x="62" y="204.0" text-anchor="end">4 GB</text>
<line x1="70" y1="160.0" x2="650" y2="160.0" style="stroke:var(--bd);stroke-width:1"/>
<text class="sm" x="62" y="164.0" text-anchor="end">5 GB</text>
<line x1="70" y1="120.0" x2="650" y2="120.0" style="stroke:var(--bd);stroke-width:1"/>
<text class="sm" x="62" y="124.0" text-anchor="end">6 GB</text>
<line x1="70" y1="80.0" x2="650" y2="80.0" style="stroke:var(--bd);stroke-width:1"/>
<text class="sm" x="62" y="84.0" text-anchor="end">7 GB</text>
<text class="sm" x="70.0" y="296" text-anchor="middle">0 min</text>
<text class="sm" x="152.85714285714286" y="296" text-anchor="middle">10 min</text>
