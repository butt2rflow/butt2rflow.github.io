<text class="sm" x="567.1428571428571" y="296" text-anchor="middle">60 min</text>
<text class="sm" x="650.0" y="296" text-anchor="middle">70 min</text>
<path d="M70.0 130.4 L78.3 124.8 L86.6 123.6 L94.9 126.0 L103.1 128.0 L111.4 116.0 L119.7 116.0 L128.0 112.4 L136.3 112.0 L144.6 112.0 L152.9 112.0 L161.1 112.0 L169.4 109.2 L177.7 108.0 L186.0 107.2 L194.3 104.4 L202.6 103.6 L210.9 105.6 L219.1 99.6 L227.4 99.6 L235.7 99.2 L244.0 99.2 L252.3 99.2 L260.6 99.2 L268.9 116.8 L277.1 100.4 L285.4 115.6 L293.7 105.2 L310.3 114.0 L318.6 103.6 L326.9 92.4 L335.1 92.4 L343.4 92.0 L351.7 92.0 L360.0 119.2 L368.3 101.2 L376.6 88.4 L384.9 88.0 L393.1 88.0 L401.4 88.0 L409.7 87.6 L418.0 87.6 L426.3 115.2 L434.6 101.2 L442.9 85.6 L451.1 84.8 L459.4 84.8 L467.7 110.0 L476.0 92.4 L484.3 81.6 L492.6 121.6 L500.9 106.4 L509.1 91.6 L517.4 82.0 L525.7 108.8 L534.0 94.4 L550.6 125.2 L558.9 107.2 L567.1 86.8 L575.4 120.8 L583.7 108.4 L592.0 92.4 L600.3 111.6 L608.6 93.6 L616.9 121.2 L625.1 104.0 L633.4 90.4" style="stroke:var(--red);stroke-width:2;fill:none"/>
<text class="nd" x="86.57142857142857" y="82.0" style="fill:var(--red)">FoundationPose container</text>
<path d="M70.0 269.2 L326.9 265.6 L583.7 263.2 L641.7 263.2" style="stroke:var(--blue);stroke-width:2;fill:none"/>
<text class="nd" x="86.57142857142857" y="255.2" style="fill:var(--blue)">cuMotion (leaner): flat at 2.3–2.4 GB</text>
<rect x="360.0" y="78.0" width="281.7" height="48.0" rx="4" style="fill:none;stroke:var(--amber);stroke-width:1.4;stroke-dasharray:4 3"/>
<text class="sm" x="500.85714285714283" y="72.0" text-anchor="middle" style="fill:var(--amber)">0.4–1.0 GB within a minute per re-acquisition</text>
