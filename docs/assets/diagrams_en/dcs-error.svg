<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">Depth error vs distance: short vs long baseline</title>
<desc id="de">The horizontal axis is camera-to-object distance (cm), the vertical axis depth error (mm). The D405 (18 mm baseline) gives depth from 7 cm, with about 0.4 mm error at 20 cm, but the error grows with the square of distance and reaches about 1 cm at 1 m. The OAK-D Pro (75 mm baseline) gives no depth inside about 80 cm at default settings, but its error at 1 m is only about 1.2 mm. Lower resolution and a wider search bring it to about 20 cm (dashed). The 15–40 cm wrist band is shaded. Approximate values assuming 0.08 px sub-pixel precision.</desc>
<style>
