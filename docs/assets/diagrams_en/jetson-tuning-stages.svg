text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.h{font-size:15px;font-weight:700;fill:#3d3d3a;}
.sub{font-size:10.5px;fill:#73726c;}
.m{font-size:11.5px;font-weight:700;fill:#3f4d66;}
.s{font-size:9.5px;fill:#73726c;}
.v{font-size:10.5px;font-weight:700;fill:#5f5e58;}
.vg{font-size:10.5px;font-weight:700;fill:#15803d;}
.tot{font-size:12px;font-weight:700;fill:#3d3d3a;}
.tag{font-size:9.5px;font-weight:700;fill:#ffffff;}
.lane{font-size:12px;font-weight:700;fill:#3d3d3a;}
</style>
<rect x="0" y="0" width="680" height="392" rx="12" fill="#FAF8F2"/>
