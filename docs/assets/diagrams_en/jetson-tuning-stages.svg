<svg width="100%" viewBox="0 0 680 392" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Chain time per stage, before and after tuning</title>
<desc>FoundationPose 6.33→1.25 s, FoundationStereo 2.01→1.99 s, Grounding DINO 1.94→0.58 s, depth re-projection 0.62→0.02 s, SAM2 0.44→0.10 s, undistort 0.10→0.09 s. Total 11.42→4.03 s (2.8×). FoundationPose shrank the most; FoundationStereo is now the bottleneck.</desc>
