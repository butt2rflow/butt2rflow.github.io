<svg width="100%" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Same cup, two viewpoints, different numbers</title>
<desc>One cup in the middle. A person on the left measures it as "2 right, 3 ahead"; a friend on the right measures the same cup as "2 left, 3 behind". Same object, different numbers, because each measures from their own viewpoint — that viewpoint is a frame of reference.</desc>
<style>
:root { --tp:#3d3d3a; --ts:#73726c; --br:#d6d3c8; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.h{font-size:14px;font-weight:600;fill:var(--tp);}
.s{font-size:12px;fill:var(--ts);}
.you{font-size:13px;font-weight:700;fill:#2f6fed;}
.fr{font-size:13px;font-weight:700;fill:#16a34a;}
</style>
<rect x="0" y="0" width="680" height="240" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="34">Same cup, two viewpoints, different numbers</text>

<!-- cup -->
<ellipse cx="340" cy="130" rx="26" ry="20" fill="#0d9488" opacity="0.85"/>
<text class="s" x="340" y="176" text-anchor="middle">the cup</text>

<!-- YOU (left) -->
<circle cx="120" cy="120" r="15" fill="#2f6fed"/>
<text class="you" x="120" y="96" text-anchor="middle">YOU</text>
<text class="s" x="120" y="164" text-anchor="middle">"2 right, 3 ahead"</text>
<line x1="138" y1="122" x2="316" y2="128" stroke="#2f6fed" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>

<!-- FRIEND (right) -->
<circle cx="560" cy="120" r="15" fill="#16a34a"/>
<text class="fr" x="560" y="96" text-anchor="middle">FRIEND</text>
<text class="s" x="560" y="164" text-anchor="middle">"2 left, 3 behind"</text>
<line x1="542" y1="122" x2="364" y2="128" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>

<text class="s" x="340" y="214" text-anchor="middle">same object · different numbers · each from its own frame</text>
</svg>
