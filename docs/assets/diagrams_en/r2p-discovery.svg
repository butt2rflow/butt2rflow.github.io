<svg width="100%" viewBox="0 0 680 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">Nodes find each other on the network</title>
<desc id="de">Two computers on the same network. With ROS_DOMAIN_ID 7 on both, each sees the other's nodes and topics; with 7 on one and 0 on the other, they can't see each other even on the same cable.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:14px;font-weight:700}
.lb{font-size:12.5px;font-weight:700}
.st{font-size:11px;fill:var(--mut)}
.nd{font-size:11.5px;font-weight:600}
.code{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px}
.panel{fill:var(--bg);stroke:var(--bd);stroke-width:1}
.pc{fill:var(--card);stroke:var(--blue);stroke-width:1.4}
.net{stroke:var(--mut);stroke-width:2}
.ok{stroke:var(--teal);stroke-width:1.6;fill:none;marker-end:url(#at);marker-start:url(#at)}
.no{stroke:var(--red);stroke-width:1.6;fill:none;stroke-dasharray:5 4}
.mkt{fill:var(--teal)}
</style>
<defs>
<marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkt"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="680" height="236" rx="12"/>
<text class="t" x="18" y="26">No setup needed, but only within the same "room number"</text>
<!-- case A -->
<rect class="panel" x="16" y="42" width="316" height="178" rx="10"/>
<text class="lb" x="30" y="64" style="fill:var(--teal)">① Same number: visible</text>
<rect class="pc" x="32" y="80" width="118" height="62" rx="8"/>
<text class="nd" x="91" y="102" text-anchor="middle">PC next to robot</text>
<text class="code" x="91" y="124" text-anchor="middle">DOMAIN_ID=7</text>
<rect class="pc" x="198" y="80" width="118" height="62" rx="8"/>
<text class="nd" x="257" y="102" text-anchor="middle">laptop nearby</text>
<text class="code" x="257" y="124" text-anchor="middle">DOMAIN_ID=7</text>
<line class="ok" x1="154" y1="111" x2="194" y2="111"/>
<line class="net" x1="40" y1="170" x2="308" y2="170"/>
<line class="net" x1="91" y1="142" x2="91" y2="170"/>
<line class="net" x1="257" y1="142" x2="257" y2="170"/>
<text class="st" x="174" y="190" text-anchor="middle">same network segment</text>
<text class="st" x="174" y="208" text-anchor="middle">the laptop sees the robot-side topics</text>
<!-- case B -->
<rect class="panel" x="348" y="42" width="316" height="178" rx="10"/>
<text class="lb" x="362" y="64" style="fill:var(--red)">② Different number: invisible</text>
<rect class="pc" x="364" y="80" width="118" height="62" rx="8"/>
<text class="nd" x="423" y="102" text-anchor="middle">PC next to robot</text>
<text class="code" x="423" y="124" text-anchor="middle">DOMAIN_ID=7</text>
<rect class="pc" x="530" y="80" width="118" height="62" rx="8"/>
<text class="nd" x="589" y="102" text-anchor="middle">laptop nearby</text>
<text class="code" x="589" y="124" text-anchor="middle">DOMAIN_ID=0</text>
<line class="no" x1="486" y1="111" x2="526" y2="111"/>
<text class="lb" x="506" y="104" text-anchor="middle" style="fill:var(--red)">✕</text>
<line class="net" x1="372" y1="170" x2="640" y2="170"/>
<line class="net" x1="423" y1="142" x2="423" y2="170"/>
<line class="net" x1="589" y1="142" x2="589" y2="170"/>
<text class="st" x="506" y="190" text-anchor="middle">cable connected, but</text>
<text class="st" x="506" y="208" text-anchor="middle">a common cause of "I see no topics"</text>
</svg>
