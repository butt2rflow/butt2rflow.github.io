<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Target architecture — train on the desktop, infer on the Jetson</title>
<desc>Heavy training and simulation run on a desktop RTX GPU; the resulting models and policies come down to the Jetson Orin NX, which runs only the real-time perceive-to-act inference at the cell. The Jetson takes camera input and sends commands to the robot.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.h{font-size:15px;font-weight:700;}
.t{font-size:13px;font-weight:700;}
.s{font-size:10.5px;fill:#73726c;}
.lbl{font-size:11px;font-weight:600;fill:#73726c;}
</style>
<rect x="0" y="0" width="680" height="300" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="40" style="fill:#3d3d3a">Goal — train on the desktop, infer on the Jetson</text>

<rect x="40" y="96" width="210" height="120" rx="10" fill="#eef1f6" stroke="#5b6b86" stroke-width="1.3"/>
<text class="t" x="145" y="130" text-anchor="middle" style="fill:#3f4d66">Desktop (RTX GPU)</text>
<text class="s" x="145" y="156" text-anchor="middle">heavy training · simulation</text>
<text class="s" x="145" y="174" text-anchor="middle">Isaac Lab / Sim</text>
<text class="s" x="145" y="196" text-anchor="middle">(can't run on Jetson)</text>

<line x1="250" y1="150" x2="312" y2="150" stroke="#8a8781" stroke-width="2.2"/>
<path d="M304,145 L312,150 L304,155" fill="none" stroke="#8a8781" stroke-width="2.2"/>
<text class="lbl" x="281" y="140" text-anchor="middle">models · policy</text>

<rect x="322" y="52" width="150" height="30" rx="8" fill="#fff" stroke="#c9c6bc" stroke-width="1"/>
<text class="s" x="397" y="72" text-anchor="middle">camera (perception in)</text>
<line x1="397" y1="82" x2="397" y2="94" stroke="#8a8781" stroke-width="2.2"/>
<path d="M392,86 L397,94 L402,86" fill="none" stroke="#8a8781" stroke-width="2.2"/>

<rect x="322" y="96" width="180" height="120" rx="10" fill="#e3f6ea" stroke="#16a34a" stroke-width="1.6"/>
<text class="t" x="412" y="130" text-anchor="middle" style="fill:#15803d">Jetson Orin NX</text>
<text class="s" x="412" y="156" text-anchor="middle">real-time inference</text>
<text class="s" x="412" y="174" text-anchor="middle">perceive → act</text>
<text class="s" x="412" y="196" text-anchor="middle">local, at the cell</text>

<line x1="502" y1="150" x2="560" y2="150" stroke="#8a8781" stroke-width="2.2"/>
<path d="M552,145 L560,150 L552,155" fill="none" stroke="#8a8781" stroke-width="2.2"/>
<text class="lbl" x="531" y="140" text-anchor="middle">command</text>

<rect x="568" y="112" width="80" height="76" rx="10" fill="#fff" stroke="#c9c6bc" stroke-width="1.2"/>
<text class="t" x="608" y="148" text-anchor="middle" style="fill:#3d3d3a">Robot</text>
<text class="s" x="608" y="166" text-anchor="middle">arm</text>

<text class="s" x="40" y="276" style="fill:#8a6d3b">Heavy training on a desktop GPU, only real-time inference on the edge Jetson — a two-machine split.</text>
</svg>
