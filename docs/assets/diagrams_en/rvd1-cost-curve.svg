<svg width="100%" viewBox="0 0 360 248" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">Matching Score: Textured vs. Textureless Surface</title>
<desc id="de">A textured surface drops sharply in score at the right position, forming a valley; a shiny textureless surface makes every candidate look alike, so there is no valley and the depth map gets holes.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="248" rx="12"/>
<text class="t" x="18" y="22">Matching-score curve — is there a valley?</text>
<rect class="bx" x="16" y="34" width="328" height="88" rx="10"/>
<text class="lb" x="30" y="54" style="fill:var(--teal)">Textured surface (cardboard, print)</text>
<path d="M36,70 L76,74 L116,76 L150,80 L170,112 L190,80 L224,76 L264,74 L324,70"
 fill="none" stroke="var(--teal)" stroke-width="2.2"/>
<path class="ln dash" d="M170,68 L170,112"/>
<text class="lb" x="200" y="106" style="fill:var(--teal)">Sharp valley = answer certain</text>
<rect class="bx" x="16" y="134" width="328" height="88" rx="10"/>
<text class="lb" x="30" y="154" style="fill:var(--red)">Shiny textureless surface (chrome, paint)</text>
<path d="M36,182 L60,178 L84,184 L108,179 L132,185 L156,180 L180,184 L204,179 L228,185 L252,180 L276,184 L300,179 L324,183"
 fill="none" stroke="var(--red)" stroke-width="2.2"/>
<text class="lb" x="180" y="210" text-anchor="middle" style="fill:var(--red)">All alike = anywhere looks right → holes</text>
</svg>
