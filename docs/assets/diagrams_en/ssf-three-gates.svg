<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Which variables you must get right at earnings</title>
<desc>In the same situation, an option buyer must pass all three gates — direction, size, and implied volatility — and passing only two still loses. A long SSF profits by passing the single gate of direction.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
:root { --tp:#3d3d3a; --ts:#73726c; --ar:#73726c;
        --tf:#E1F5EE; --tk:#0F6E56; --tt:#085041; --tu:#0F6E56;
        --cf:#FAECE7; --ck:#993C1D; --ct:#712B13; --cu:#993C1D; }
@media (prefers-color-scheme: dark) { :root { --tp:#e0ded5; --ts:#a8a59a; --ar:#a8a59a;
        --tf:#085041; --tk:#9FE1CB; --tt:#E1F5EE; --tu:#9FE1CB;
        --cf:#712B13; --ck:#F5C4B3; --ct:#FAECE7; --cu:#F5C4B3; } }
text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.th { font-size:14px; font-weight:500; fill:var(--tp); }
.s { font-size:12px; font-weight:400; fill:var(--ts); }
.pass rect { fill:var(--tf); stroke:var(--tk); }
.pass .n { font-size:14px; font-weight:500; fill:var(--tt); }
.pass .m { font-size:12px; font-weight:400; fill:var(--tu); }
.fail rect { fill:var(--cf); stroke:var(--ck); }
.fail .n { font-size:14px; font-weight:500; fill:var(--ct); }
.fail .m { font-size:12px; font-weight:400; fill:var(--cu); }
.fl { stroke:var(--ar); stroke-width:1.5; fill:none; }
</style>

<text class="s" x="340" y="34" text-anchor="middle">Same setup — stock +3% after earnings, expected move was ±7%</text>

<text class="th" x="180" y="66" text-anchor="middle">Long call</text>
<text class="th" x="500" y="66" text-anchor="middle">Long SSF</text>

<g class="pass">
<rect x="70" y="84" width="220" height="52" rx="8" stroke-width="0.5"/>
<text class="n" x="180" y="104" text-anchor="middle" dominant-baseline="central">Direction right?</text>
<text class="m" x="180" y="122" text-anchor="middle" dominant-baseline="central">Pass — it rose</text>
</g>

<g class="pass">
<rect x="390" y="84" width="220" height="52" rx="8" stroke-width="0.5"/>
<text class="n" x="500" y="104" text-anchor="middle" dominant-baseline="central">Direction right?</text>
<text class="m" x="500" y="122" text-anchor="middle" dominant-baseline="central">Pass — it rose</text>
</g>

<line class="fl" x1="180" y1="136" x2="180" y2="172" marker-end="url(#ar)"/>

<g class="fail">
<rect x="70" y="176" width="220" height="52" rx="8" stroke-width="0.5"/>
<text class="n" x="180" y="196" text-anchor="middle" dominant-baseline="central">Move beyond ±7%?</text>
<text class="m" x="180" y="214" text-anchor="middle" dominant-baseline="central">Fail — only 3%</text>
</g>

<line class="fl" x1="180" y1="228" x2="180" y2="264" marker-end="url(#ar)"/>

<g class="fail">
<rect x="70" y="268" width="220" height="52" rx="8" stroke-width="0.5"/>
<text class="n" x="180" y="288" text-anchor="middle" dominant-baseline="central">IV not expensive?</text>
<text class="m" x="180" y="306" text-anchor="middle" dominant-baseline="central">Fail — crushed at the print</text>
</g>

<line class="fl" x1="180" y1="320" x2="180" y2="360" marker-end="url(#ar)"/>
<line class="fl" x1="500" y1="136" x2="500" y2="360" marker-end="url(#ar)"/>

<g class="fail">
<rect x="70" y="364" width="220" height="56" rx="8" stroke-width="1"/>
<text class="n" x="180" y="384" text-anchor="middle" dominant-baseline="central">−11%</text>
<text class="m" x="180" y="404" text-anchor="middle" dominant-baseline="central">Right direction, still a loss</text>
</g>

<g class="pass">
<rect x="390" y="364" width="220" height="56" rx="8" stroke-width="1"/>
<text class="n" x="500" y="384" text-anchor="middle" dominant-baseline="central">+20%</text>
<text class="m" x="500" y="404" text-anchor="middle" dominant-baseline="central">on margin</text>
</g>

<text class="s" x="340" y="450" text-anchor="middle">The futures price formula has no volatility (σ) — so there is only one gate</text>
</svg>
