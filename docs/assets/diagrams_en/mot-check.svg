<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">The map looked wrong, but the check was wrong</title>
<desc id="de">To check the map, it was redrawn from the camera's viewpoint and compared with the measured depth. The first check plotted only the mesh vertices, one pixel each. But at 0.4 m one 2 cm cell covers about 400 pixels on screen, so the near board looked mostly empty and far points showed through the gaps: 14% agreement. Filling the mesh faces properly gave a 5 mm median and 81% within 3 cm. The map had been right all along.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--green:#15803d;--chip:#f3efe4;--term:#1f2430;--termfg:#d6dbe5;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--green:#4ade80;--chip:#26251e;--term:#0e1016;--termfg:#d6dbe5;}}
