<svg width="100%" viewBox="0 0 360 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">Global attention ranking across candidates</title>
<desc id="de">Rather than scoring candidates independently, attention over the whole set assigns a relative ranking. If lighting/material bias is common to all, it cancels out automatically.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--blue:#2f6fed;--teal:#0d9488;--amber:#d97706;--red:#dc2626;--yel:#eab308;--chip:#f3efe4;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--blue:#7aa5ff;--teal:#4fd1c5;--amber:#fbbf24;--red:#f87171;--yel:#fde047;--chip:#26251e;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:13px;font-weight:700}
.st{font-size:11.5px;fill:var(--mut)}
.lb{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:.02em}
.bx{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.bxc{fill:var(--chip);stroke:var(--bd);stroke-width:1.2}
.ln{stroke:var(--mut);stroke-width:1.4;fill:none}
.ar{stroke:var(--mut);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.arb{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#ahb)}
.dash{stroke-dasharray:4 3}
.hi{fill:var(--blue)}.hi2{fill:var(--teal)}.hi3{fill:var(--amber)}.bad{fill:var(--red)}.mk{fill:var(--mut)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="360" height="270" rx="12"/>
<text class="t" x="18" y="22">Alone you can't tell; together you can</text>
<rect class="bx" x="16" y="36" width="328" height="76" rx="10"/>
<text class="lb" x="30" y="55" style="fill:var(--red)">Naive way: score each candidate independently</text>
<text class="st" x="30" y="74">"How close is this render to reality" → 0.81</text>
<text class="st" x="30" y="92">Lighting/reflection makes even <tspan style="fill:var(--red)">the answer score low</tspan></text>
<text class="st" x="30" y="107">→ absolute scores can't be trusted</text>
<rect class="bx" x="16" y="122" width="328" height="96" rx="10"/>
<text class="lb" x="30" y="141" style="fill:var(--teal)">Real way: all candidates in one place</text>
<g>
<rect class="bxc" x="34" y="152" width="40" height="26" rx="4"/><text class="lb" x="54" y="169" text-anchor="middle">h1</text>
<rect class="bxc" x="84" y="152" width="40" height="26" rx="4"/><text class="lb" x="104" y="169" text-anchor="middle">h2</text>
<rect x="134" y="152" width="40" height="26" rx="4" fill="var(--teal)" opacity=".4" stroke="var(--bd)"/><text class="lb" x="154" y="169" text-anchor="middle">h3</text>
<rect class="bxc" x="184" y="152" width="40" height="26" rx="4"/><text class="lb" x="204" y="169" text-anchor="middle">h4</text>
<text class="lb" x="244" y="169" text-anchor="middle">···</text>
<rect class="bxc" x="266" y="152" width="40" height="26" rx="4"/><text class="lb" x="286" y="169" text-anchor="middle">hK</text>
</g>
<path class="ln dash" d="M54,184 C54,200 154,200 154,184" stroke="var(--teal)"/>
<path class="ln dash" d="M104,184 C104,196 154,196 154,184" stroke="var(--teal)"/>
<path class="ln dash" d="M286,184 C286,206 154,206 154,184" stroke="var(--teal)"/>
<text class="st" x="180" y="214" text-anchor="middle">They reference each other for a relative ranking</text>
<text class="lb" x="180" y="240" text-anchor="middle">"Am I the best?" needs a look at the others</text>
<text class="lb" x="180" y="260" text-anchor="middle" style="fill:var(--teal)">Lighting/material bias common to all candidates cancels automatically</text>
</svg>
