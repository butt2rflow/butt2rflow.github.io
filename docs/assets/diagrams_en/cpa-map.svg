<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">Map of this blog's Physical AI posts</title>
<desc id="de">This post sits in the middle and links to the posts that cover each concept in depth. Step 3 Track A's perception stages: the Robot Vision series. Frame conversion: Frames &amp; Transforms. ROS 2, MoveIt 2 and deterministic cell design: the Pendant to ROS 2 series. Running on an edge computer: Field Notes. Differences between robot makers: the Cobots series. Simulation and sim-to-real: the robot simulation post. Track B has no dedicated post yet.</desc>
<style>
