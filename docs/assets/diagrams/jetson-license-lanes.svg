<svg width="100%" viewBox="0 0 680 308" xmlns="http://www.w3.org/2000/svg" role="img">
<title>연구용 체인과 상업용 체인의 라이선스</title>
<desc>연구용 체인은 Grounding DINO(Apache-2.0), SAM2(Apache-2.0), NVLabs FoundationStereo·FoundationPose(비상업 라이선스)로 이뤄진다. 상업용 체인은 앞 두 단계는 같고, 깊이는 ESS 또는 NGC판 FoundationStereo, 자세는 Isaac ROS FoundationPose 노드와 NGC 가중치를 쓴다. 둘 다 NVIDIA가 상업 사용 가능으로 표시한 모델이다. YOLO-World는 GPL/AGPL이라 연구용에만 둔다.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.h{font-size:15px;font-weight:700;fill:#3d3d3a;}
.sub{font-size:10.5px;fill:#73726c;}
.m{font-size:11.5px;font-weight:700;fill:#3f4d66;}
.s{font-size:9.5px;fill:#73726c;}
.v{font-size:10.5px;font-weight:700;fill:#5f5e58;}
.vg{font-size:10.5px;font-weight:700;fill:#15803d;}
.tot{font-size:12px;font-weight:700;fill:#3d3d3a;}
.tag{font-size:9.5px;font-weight:700;fill:#ffffff;}
.lane{font-size:12px;font-weight:700;fill:#3d3d3a;}
</style>
<rect x="0" y="0" width="680" height="308" rx="12" fill="#FAF8F2"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#9a988f"/></marker></defs>
<text class="h" x="40" y="32">같은 네 단계, 다른 라이선스</text>
<text class="sub" x="40" y="50">단계마다 어떤 구현과 가중치를 쓰느냐로 상업 사용 가능 여부가 갈린다</text>
