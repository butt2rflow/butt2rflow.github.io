<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>찍고 · 렌더 · 비교 · 다듬기 — 가장 잘 맞는 포즈가 이긴다</title>
<desc>CAD 모델을 여러 후보 포즈에 놓아, 서로 다르게 회전한 흐릿한 유령 상자들로 보인다. 각각을 렌더링해 실제 사진과 비교하고, 가장 잘 맞는 것이 이긴다. 승자는 진하게, 위치와 방향을 담은 세 축 표시(6-DoF 포즈)와 함께 그려진다.</desc>
<style>
:root { --tp:#3d3d3a; --ts:#73726c; --br:#d6d3c8; }
text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.h{font-size:14px;font-weight:600;fill:var(--tp);}
.s{font-size:12px;fill:var(--ts);}
.cap{font-size:12px;font-weight:600;fill:#16a34a;}
.ax{font-size:11px;font-weight:600;}
</style>
<rect x="0" y="0" width="680" height="280" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="34">찍고 · 렌더 · 비교 · 다듬기 — 가장 잘 맞는 게 이긴다</text>
<text class="s" x="40" y="56">후보 포즈 수백 개를 시도해, 사진에 가장 가까운 걸 남긴다</text>

<g fill="#16a34a" opacity="0.16" stroke="#16a34a" stroke-opacity="0.4" stroke-width="1">
<rect x="96" y="150" width="70" height="52" rx="6" transform="rotate(-20 131 176)"/>
<rect x="216" y="120" width="70" height="52" rx="6" transform="rotate(15 251 146)"/>
<rect x="180" y="196" width="70" height="52" rx="6" transform="rotate(-6 215 222)"/>
<rect x="300" y="170" width="70" height="52" rx="6" transform="rotate(24 335 196)"/>
</g>
<text class="s" x="210" y="262" text-anchor="middle">후보 포즈 (시도·채점)</text>

<rect x="470" y="130" width="96" height="72" rx="8" fill="#16a34a" opacity="0.18" stroke="#16a34a" stroke-width="2"/>
<g stroke-width="3" stroke-linecap="round">
<line x1="518" y1="166" x2="556" y2="152" stroke="#e0392b"/>
<line x1="518" y1="166" x2="492" y2="146" stroke="#22a34a"/>
<line x1="518" y1="166" x2="518" y2="204" stroke="#2f6fed"/>
</g>
<circle cx="518" cy="166" r="3.5" fill="#3d3d3a"/>
<text class="ax" x="560" y="150" fill="#e0392b">x</text>
<text class="ax" x="484" y="142" fill="#22a34a">y</text>
<text class="ax" x="524" y="216" fill="#2f6fed">z</text>
<text class="cap" x="518" y="118" text-anchor="middle">승리한 6-DoF 포즈</text>
</svg>
