<svg width="100%" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">새 터미널에서 source를 잊으면</title>
<desc id="de">왼쪽 터미널은 setup 파일을 source한 뒤 ros2 launch를 실행해 정상 동작한다. 오른쪽은 새로 연 터미널에서 source 없이 같은 명령을 실행해 패키지를 찾을 수 없다는 에러가 난다. 해결은 그 창에서 다시 source하는 것이다.</desc>
<style>
:root{--bg:#FAF8F2;--card:#ffffff;--fg:#2f2f2c;--mut:#6f6e68;--bd:#ddd9cc;--teal:#0d9488;--red:#dc2626;--term:#1f2430;--termfg:#d6dbe5;}
@media (prefers-color-scheme: dark){:root{--bg:#14140f;--card:#1e1e19;--fg:#e8e6df;--mut:#a3a199;--bd:#3a382f;--teal:#4fd1c5;--red:#f87171;--term:#0e1016;--termfg:#d6dbe5;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:var(--fg);}
.bg{fill:var(--card);}
.t{font-size:14px;font-weight:700}
.lb{font-size:12.5px;font-weight:700}
.st{font-size:11px;fill:var(--mut)}
.term{fill:var(--term);stroke-width:2}
.tc{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px;fill:var(--termfg)}
.tg{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px;fill:#7ee0a0}
.tr{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px;fill:#ff8a8a}
.dim{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:11px;fill:#8a93a6}
</style>
<rect class="bg" x="0" y="0" width="680" height="240" rx="12"/>
<text class="t" x="18" y="26">새 창을 열면 source부터</text>
<text class="lb" x="24" y="52" style="fill:var(--teal)">창 1: source 했음</text>
<rect class="term" x="18" y="62" width="314" height="130" rx="10" style="stroke:var(--teal)"/>
<text class="tg" x="32" y="90">$ source install/setup.bash</text>
<text class="tg" x="32" y="114">$ ros2 launch my_cell cell.launch.py</text>
<text class="dim" x="32" y="140">[INFO] camera_driver started</text>
<text class="dim" x="32" y="160">[INFO] move_group started</text>
<text class="tc" x="32" y="180">...</text>
<text class="lb" x="354" y="52" style="fill:var(--red)">창 2: 새로 열고 바로 실행</text>
<rect class="term" x="348" y="62" width="314" height="130" rx="10" style="stroke:var(--red)"/>
<text class="tg" x="362" y="90">$ ros2 launch my_cell cell.launch.py</text>
<text class="tr" x="362" y="116">Package 'my_cell' not found: …</text>
<text class="dim" x="362" y="148"># 설치가 잘못된 게 아니다.</text>
<text class="dim" x="362" y="168"># 이 창이 빌드 결과를 모를 뿐.</text>
<text class="st" x="18" y="220" style="fill:var(--fg)">해결: 창 2에서도 source install/setup.bash. 창마다 따로 기억하기 때문이다.</text>
</svg>
