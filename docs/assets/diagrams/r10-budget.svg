<line x1="436.8" y1="84" x2="436.8" y2="306" style="stroke:var(--bd);stroke-width:1"/>
<text class="sm" x="436.83769633507853" y="322" text-anchor="middle">8 GB</text>
<line x1="557.3" y1="84" x2="557.3" y2="306" style="stroke:var(--bd);stroke-width:1"/>
<text class="sm" x="557.2565445026178" y="322" text-anchor="middle">12 GB</text>
<line x1="656.0" y1="84" x2="656.0" y2="306" style="stroke:var(--red);stroke-width:1.3;stroke-dasharray:4 3"/>
<text class="sm" x="656.0" y="322" text-anchor="middle" style="fill:var(--red)">15.3</text>
<text class="it" x="186" y="106" text-anchor="end">모션만</text>
<text class="sm" x="186" y="122" text-anchor="end">7.6시간, 끝까지</text>
<rect x="196.0" y="92" width="112.9" height="34" rx="2" style="fill:var(--blue)"/>
<text class="nd" x="252.44633507853405" y="114" text-anchor="middle" style="fill:#ffffff">3.8</text>
<rect x="308.9" y="92" width="9.9" height="34" rx="2" style="fill:var(--teal)"/>
<rect x="318.8" y="92" width="337.2" height="34" rx="2" style="fill:var(--chip);stroke:var(--bd);stroke-dasharray:4 3"/>
<text class="sm" x="487.4136125654451" y="114" text-anchor="middle">운영체제 + 남은 메모리</text>
<text class="it" x="186" y="160" text-anchor="end">계속 추적, 어두움</text>
<text class="sm" x="186" y="176" text-anchor="end">26분에 멈춘 순간</text>
<rect x="196.0" y="146" width="201.7" height="34" rx="2" style="fill:var(--red)"/>
<text class="nd" x="296.85078534031413" y="168" text-anchor="middle" style="fill:#ffffff">6.7</text>
<rect x="397.7" y="146" width="95.1" height="34" rx="2" style="fill:var(--amber)"/>
<text class="nd" x="445.26701570680626" y="168" text-anchor="middle" style="fill:#ffffff">3.2</text>
<rect x="492.8" y="146" width="75.6" height="34" rx="2" style="fill:var(--blue)"/>
<text class="nd" x="530.6138743455497" y="168" text-anchor="middle" style="fill:#ffffff">2.5</text>
<rect x="568.4" y="146" width="9.0" height="34" rx="2" style="fill:var(--teal)"/>
<rect x="577.4" y="146" width="50.6" height="34" rx="2" style="fill:var(--mut)"/>
<text class="nd" x="602.7146596858638" y="168" text-anchor="middle" style="fill:#ffffff">1.7</text>
<rect x="628.0" y="146" width="28.0" height="34" rx="2" style="fill:var(--green)"/>
