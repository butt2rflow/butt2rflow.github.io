<rect x="196.0" y="200" width="202.9" height="34" rx="2" style="fill:var(--red)"/>
<text class="nd" x="297.4528795811518" y="222" text-anchor="middle" style="fill:#ffffff">6.7</text>
<rect x="398.9" y="200" width="97.5" height="34" rx="2" style="fill:var(--amber)"/>
<text class="nd" x="447.67539267015707" y="222" text-anchor="middle" style="fill:#ffffff">3.2</text>
<rect x="496.4" y="200" width="72.9" height="34" rx="2" style="fill:var(--blue)"/>
<text class="nd" x="532.8717277486911" y="222" text-anchor="middle" style="fill:#ffffff">2.4</text>
<rect x="569.3" y="200" width="9.6" height="34" rx="2" style="fill:var(--teal)"/>
<rect x="578.9" y="200" width="51.2" height="34" rx="2" style="fill:var(--mut)"/>
<text class="nd" x="604.5209424083769" y="222" text-anchor="middle" style="fill:#ffffff">1.7</text>
<rect x="630.1" y="200" width="25.9" height="34" rx="2" style="fill:var(--green)"/>
<text class="it" x="186" y="268" text-anchor="end">사이클마다 자세 한 번</text>
<text class="sm" x="186" y="284" text-anchor="end">밝음, 중간값</text>
<rect x="196.0" y="254" width="192.7" height="34" rx="2" style="fill:var(--red)"/>
<text class="nd" x="292.3350785340314" y="276" text-anchor="middle" style="fill:#ffffff">6.4</text>
<rect x="388.7" y="254" width="100.2" height="34" rx="2" style="fill:var(--amber)"/>
<text class="nd" x="438.7945026178011" y="276" text-anchor="middle" style="fill:#ffffff">3.3</text>
<rect x="488.9" y="254" width="72.6" height="34" rx="2" style="fill:var(--blue)"/>
<text class="nd" x="525.1950261780105" y="276" text-anchor="middle" style="fill:#ffffff">2.4</text>
<rect x="561.5" y="254" width="8.4" height="34" rx="2" style="fill:var(--teal)"/>
<rect x="569.9" y="254" width="37.6" height="34" rx="2" style="fill:var(--mut)"/>
<text class="nd" x="588.7159685863874" y="276" text-anchor="middle" style="fill:#ffffff">1.2</text>
<rect x="607.5" y="254" width="48.5" height="34" rx="2" style="fill:var(--green)"/>
<text class="nd" x="631.7657068062827" y="276" text-anchor="middle" style="fill:#ffffff">1.6</text>
<text class="sm" x="18" y="346">컨테이너별 값은 Docker 기준(Jetson에서는 FoundationPose 쪽이 부풀려 보임). 남은 메모리는 운영체제가 보고한 값</text>
</svg>
