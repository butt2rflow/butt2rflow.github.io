<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>같은 컵, 두 시점, 다른 숫자</title>
<desc>가운데 컵 하나. 나는 왼쪽 아래에서, 친구는 오른쪽 위에서 같은 컵을 본다. 각자 자기 좌표축(오른쪽 방향과 앞 방향)을 가지고 있다. 나에게 컵은 "오른쪽 2, 앞으로 3", 같은 컵이 친구에게는 "왼쪽 2, 뒤로 3"이다. 좌우는 옆 위치로, 앞뒤는 위아래 위치로 드러난다. 같은 물체인데 시점마다 숫자가 다르다.</desc>
<style>
:root { --tp:#3d3d3a; --ts:#73726c; --br:#d6d3c8; }
text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.h{font-size:14px;font-weight:600;fill:var(--tp);}
.s{font-size:12px;fill:var(--ts);}
.you{font-size:13px;font-weight:700;fill:#2f6fed;}
.fr{font-size:13px;font-weight:700;fill:#16a34a;}
.ax{font-size:10px;fill:var(--ts);}
</style>
<rect x="0" y="0" width="680" height="300" rx="12" fill="#FAF8F2"/>
<text class="h" x="40" y="34">같은 컵, 두 시점, 다른 숫자</text>

<!-- cup (center) -->
<ellipse cx="360" cy="150" rx="26" ry="20" fill="#0d9488" opacity="0.85"/>
<text class="s" x="360" y="184" text-anchor="middle">그 컵</text>

<!-- sight lines -->
<line x1="164" y1="204" x2="336" y2="156" stroke="#2f6fed" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>
<line x1="526" y1="100" x2="384" y2="146" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>

<!-- 나 : bottom-left, faces up -->
<circle cx="150" cy="210" r="14" fill="#2f6fed"/>
<text class="you" x="128" y="215" text-anchor="end">나</text>
<!-- local axes: 오른쪽 → , 앞 ↑ -->
<line x1="168" y1="210" x2="204" y2="210" stroke="#2f6fed" stroke-width="1.6"/>
<path d="M198,206 L204,210 L198,214" fill="none" stroke="#2f6fed" stroke-width="1.6"/>
<text class="ax" x="210" y="214">오른쪽</text>
<line x1="150" y1="193" x2="150" y2="160" stroke="#2f6fed" stroke-width="1.6"/>
<path d="M146,166 L150,160 L154,166" fill="none" stroke="#2f6fed" stroke-width="1.6"/>
<text class="ax" x="150" y="152" text-anchor="middle">앞</text>
<text class="s" x="150" y="240" text-anchor="middle">"오른쪽 2, 앞으로 3"</text>

<!-- 친구 : top-right, faces up (same orientation) -->
<circle cx="540" cy="95" r="14" fill="#16a34a"/>
<text class="fr" x="518" y="99" text-anchor="end">친구</text>
<line x1="558" y1="95" x2="594" y2="95" stroke="#16a34a" stroke-width="1.6"/>
<path d="M588,91 L594,95 L588,99" fill="none" stroke="#16a34a" stroke-width="1.6"/>
<text class="ax" x="600" y="99">오른쪽</text>
<line x1="540" y1="78" x2="540" y2="45" stroke="#16a34a" stroke-width="1.6"/>
<path d="M536,51 L540,45 L544,51" fill="none" stroke="#16a34a" stroke-width="1.6"/>
<text class="ax" x="540" y="37" text-anchor="middle">앞</text>
<text class="s" x="540" y="128" text-anchor="middle">"왼쪽 2, 뒤로 3"</text>

<text class="s" x="340" y="282" text-anchor="middle">좌우는 옆 위치로, 앞뒤는 위아래로 — 같은 물체, 각자 자기 좌표계에서 다른 숫자</text>
</svg>
