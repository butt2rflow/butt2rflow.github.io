<svg width="100%" viewBox="0 0 680 392" xmlns="http://www.w3.org/2000/svg" role="img">
<title>체인 단계별 시간, 최적화 전과 후</title>
<desc>FoundationPose 6.33→1.25초, FoundationStereo 2.01→1.99초, Grounding DINO 1.94→0.58초, 깊이 재투영 0.62→0.02초, SAM2 0.44→0.10초, 왜곡 보정 0.10→0.09초. 합계 11.42→4.03초(2.8배). 가장 크게 준 건 FoundationPose이고, 남은 병목은 FoundationStereo다.</desc>
<style>
