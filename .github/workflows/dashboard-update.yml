name: Update live dashboard

on:
  schedule:
    # Daily at 22:00 UTC (≈ 5–6 PM US Eastern, after the 4 PM market close
    # and after Cboe publishes index closes / VIX futures settlements)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # also allow manual triggers

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy matplotlib

      - name: Run dashboard updater
        run: python scripts/update_dashboard.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/diagrams/vol_dashboard.png \
                  docs/assets/diagrams/vix_term_structure.png \
                  docs/assets/diagrams_en/vol_dashboard.png \
                  docs/assets/diagrams_en/vix_term_structure.png \
                  docs/index.ko.md docs/index.en.md
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "chore: daily dashboard refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
