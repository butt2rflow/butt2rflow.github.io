name: Archive daily VIX TS snapshot

# Runs after the US close and persists ONLY the day's VIX TS history
# (vix_history/<date>.{png,json} + manifest). Rendered home-page artifacts
# (index.{ko,en}.md, vix_term_structure.png, vol_dashboard.png, etc.) are
# rebuilt fresh by the deploy workflow on every push — committing them
# back to main creates needless conflicts with humans editing the same
# files. The vix_history archive, by contrast, must accumulate over time
# for the homepage history player, so it stays in git.

on:
  schedule:
    # Daily at 22:00 UTC (≈ 5–6 PM US Eastern, after the 4 PM market close
    # and after Cboe publishes index closes / VIX futures settlements)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy matplotlib

      - name: Run dashboard updater
        run: python scripts/update_dashboard.py

      - name: Commit & push vix_history archive if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Scope: ONLY the persistent VIX TS history archive. Everything
          # else update_dashboard.py wrote (PNGs in working tree, patched
          # index.md) is now gitignored — locally produced output, not
          # tracked content.
          git add docs/assets/diagrams/vix_history/ \
                  docs/assets/diagrams_en/vix_history/
          if git diff --cached --quiet; then
            echo "No archive changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore: archive VIX TS snapshot ($(date -u +%Y-%m-%d))"
          # Retry-with-rebase on push: another commit (human or another
          # automated run) may have landed while this job was building.
          # vix_history is daily-additive so rebase conflicts are rare.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed — rebasing onto origin/main and retrying"
            git pull --rebase origin main
          done
          echo "Push still failing after 3 attempts" >&2
          exit 1
