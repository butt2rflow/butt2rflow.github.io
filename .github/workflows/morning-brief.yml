name: Morning volatility brief

# Slack briefing at 07:30 New York time (2h before the 09:30 US open),
# Mon–Fri. Reads the previous US close, which Cboe has long since published.
#
# Primary trigger: cron-job.org POSTs a workflow_dispatch with
# inputs.source=cron at 07:30 America/New_York (it handles DST). GitHub's own
# cron ran 4-5 h late on this repo, so the schedule below is only a backup:
# it stays silent when the on-time run already briefed this close, and
# otherwise sends a brief marked as late. GitHub cron is UTC with no DST, so
# both slots are listed and morning_brief.py keeps the one that is 07:30 ET.

on:
  schedule:
    - cron: '30 11 * * 1-5'
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      source:
        description: "'cron' = cron-job.org on-time trigger; 'manual' re-briefs even if already briefed"
        default: manual

permissions:
  contents: write

# Both cron slots (and manual runs) commit to main; never overlap.
concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy matplotlib anthropic

      - name: Score past briefings (5/10/20-session outcomes)
        run: python scripts/score_briefs.py --live-only

      - name: Build briefing, chart and log (no send yet)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BRIEF_SCHEDULE: ${{ github.event.schedule }}
          # Manual runs re-brief even if this close was already briefed;
          # the cron-job.org trigger (source=cron) does not.
          BRIEF_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source != 'cron' && '1' || '0' }}
        run: python scripts/morning_brief.py --stage

      # The chart must be on main before Slack fetches it by raw URL.
      - name: Commit chart + briefing log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brief_log/
          [ -d brief_charts ] && git add brief_charts/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: briefing log + chart ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1

      # Send even if the push failed — post_slack drops the chart when Slack
      # can't fetch it. No-op when staging skipped (nothing pending).
      - name: Send to Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/morning_brief.py --send-pending
